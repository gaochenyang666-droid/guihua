<!-- Edit Profile Modal -->
<div class="modal-overlay" id="editProfileModal">
    <div class="modal glass">
        <div class="modal-header">
            <h3>✏️ 编辑资料</h3>
            <button class="modal-close" id="editProfileCloseBtn" type="button">&times;</button>
        </div>
        <div class="form-group profile-modal-avatar-group">
            <div id="previewAvatar" class="avatar-lg profile-modal-avatar-preview">👻</div>
            <button class="btn btn-ghost btn-sm" id="editProfileRandomAvatarBtn" type="button">🎲 随机生成鬼魂头像</button>
        </div>
        <div class="form-group">
            <label class="form-label">昵称</label>
            <input type="text" class="form-input" id="editNickname" maxlength="50">
        </div>
        <div class="form-group">
            <label class="form-label">个人简介</label>
            <textarea class="form-input" id="editBio" maxlength="500" placeholder="写点什么..."></textarea>
        </div>
        <button class="btn btn-primary profile-modal-submit-btn" id="editProfileSaveBtn" type="button">保存修改</button>
    </div>
</div>

<!-- Change Password Modal (logged-in, Web2 only) -->
<div class="modal-overlay" id="changePasswordModal">
    <div class="modal glass">
        <div class="modal-header">
            <h3>🔒 修改密码</h3>
            <button class="modal-close" id="changePasswordCloseBtn" type="button">&times;</button>
        </div>
        <div class="form-group">
            <label class="form-label">当前密码</label>
            <input type="password" class="form-input" id="cpOldPasswordIn" placeholder="当前密码">
        </div>
        <div class="form-group">
            <label class="form-label">新密码</label>
            <input type="password" class="form-input" id="cpNewPasswordIn" placeholder="新密码">
        </div>
        <div class="form-group">
            <label class="form-label">确认新密码</label>
            <input type="password" class="form-input" id="cpConfirmPasswordIn" placeholder="再输入一次">
        </div>
        <button class="btn btn-primary profile-modal-submit-btn" id="changePasswordSubmitBtn" type="button">确认修改</button>
    </div>
</div>

<div class="modal-overlay achievements-modal-overlay" id="achievementsModal">
    <div class="modal glass achievements-modal-shell">
        <div class="modal-header">
            <h3>🏆 成就安装墙</h3>
            <button class="modal-close" id="achievementsCloseBtn" type="button">&times;</button>
        </div>
        <div id="achievementsWallBody" class="achievements-wall-body">加载中...</div>
    </div>
</div>
