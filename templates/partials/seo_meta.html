{% if seo %}
    <title>{{ seo.title }}</title>
    <meta name="description" content="{{ seo.description }}">
    <meta name="robots" content="{{ seo.robots or 'index,follow' }}">
    {% if seo.canonical %}<link rel="canonical" href="{{ seo.canonical }}">{% endif %}
    <meta property="og:site_name" content="诡话">
    <meta property="og:title" content="{{ seo.og_title or seo.title }}">
    <meta property="og:description" content="{{ seo.og_description or seo.description }}">
    <meta property="og:type" content="{{ seo.og_type or 'website' }}">
    {% if seo.canonical %}<meta property="og:url" content="{{ seo.canonical }}">{% endif %}
    {% if seo.og_image %}<meta property="og:image" content="{{ seo.og_image }}">{% endif %}
    <meta name="twitter:card" content="{{ seo.twitter_card or 'summary_large_image' }}">
    <meta name="twitter:title" content="{{ seo.og_title or seo.title }}">
    <meta name="twitter:description" content="{{ seo.og_description or seo.description }}">
    {% if seo.og_image %}<meta name="twitter:image" content="{{ seo.og_image }}">{% endif %}
    {% for ld in seo.json_ld or [] %}
    <script type="application/ld+json">{{ ld|tojson }}</script>
    {% endfor %}
{% else %}
    <title>诡话</title>
{% endif %}
