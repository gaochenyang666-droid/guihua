<!-- Main Content -->
<div class="studio-container" id="studioView">
    <aside class="studio-sidebar">
        <div class="sidebar-card glass studio-step-card">
            <div class="step-progress">
                <div class="step-item active" id="stepIndicator1">
                    <div class="studio-step-title">1. 撰写</div>
                    <div class="studio-step-caption">创作你的故事</div>
                </div>
                <div class="step-item" id="stepIndicator3">
                    <div class="studio-step-title">2. 永存</div>
                    <div class="studio-step-caption">上链并发布</div>
                </div>
            </div>
        </div>
    </aside>

    <main class="studio-main">
        <div class="glass studio-main-card">

            <!-- Step 1: Content -->
            <div class="step-content active" id="step1">
                <h2 class="studio-section-title">发布新怪谈</h2>
                <div class="form-group">
                    <label class="form-label">标题</label>
                    <input type="text" class="form-input" id="studioPostTitle" placeholder="请输入引人入胜的标题...">
                </div>
                <div class="form-group studio-meta-grid">
                    <div class="studio-meta-grid-full">
                        <label class="form-label studio-label-inline">
                            <span>加入系列（可选）</span>
                            <button type="button" class="btn btn-ghost btn-sm" id="createSeriesBtn">+ 新建系列</button>
                        </label>
                        <select id="studioSeriesSelect" class="form-input">
                            <option value="">不加入系列</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label studio-label-inline">
                        <span>正文内容</span>
                        <span class="studio-draft-status" id="draftStatus"></span>
                    </label>
                    <div id="quillEditorWrap" class="studio-editor-wrap">
                        <div id="studioPostContent" class="studio-editor"></div>
                    </div>
                </div>
                <button class="btn btn-primary studio-block-button studio-step-button" id="studioNextStepBtn">下一步: 永存确认</button>
            </div>

            <!-- Step 3: Payment Preview -->
            <div class="step-content" id="step3">
                <h2 class="studio-section-title studio-section-title-centered">Web3 永存确认</h2>
                <p class="studio-step-description">您仅需支付 USDT（BSC），永存档案由平台负责。</p>
                <div class="studio-payment-summary">
                    <div class="studio-summary-row studio-summary-row-separated">
                        <span class="studio-summary-label">支付网络</span>
                        <span>BSC Mainnet 主网 (ID: 56)</span>
                    </div>
                    <div class="studio-summary-row studio-summary-row-separated">
                        <span class="studio-summary-label">永存档案</span>
                        <span class="studio-summary-note">由平台负责</span>
                    </div>
                    <div class="studio-summary-row studio-summary-row-amount">
                        <span class="studio-summary-label">您需支付</span>
                        <span id="studioFeeDisplay" class="studio-fee-display">—</span>
                    </div>
                </div>

                <div id="walletActionArea">
                    <button class="btn btn-primary studio-block-button studio-publish-button" id="publishBtn">
                        ⚡ 确认支付并发布
                    </button>
                </div>
                <div id="adminSpecialArea" class="studio-admin-special" hidden>
                    <label class="studio-admin-special-label">
                        <input type="checkbox" id="adminSpecialPostCheckbox">
                        <span class="studio-admin-special-text">发布为特殊帖子（始终优先出现在第一页）</span>
                    </label>
                </div>
                <div class="studio-resume-block">
                    <div class="studio-resume-copy">已支付但未完成发帖？输入交易哈希继续（无需再付）</div>
                    <div class="studio-resume-row">
                        <input type="text" id="resumeTxHashInput" class="form-input studio-resume-input" placeholder="0x...">
                        <button type="button" class="btn btn-ghost" id="resumeWithTxHashBtn">用该哈希继续</button>
                    </div>
                    <div id="resumeStatePanel" class="resume-state-panel" hidden>
                        <div class="resume-state-header">
                            <div>
                                <div class="resume-state-eyebrow">发布进度</div>
                                <div id="resumeStateMessage" class="resume-state-message">等待检查交易状态…</div>
                            </div>
                            <div class="resume-state-actions">
                                <button type="button" class="btn btn-ghost btn-sm" id="resumeCheckBtn">刷新状态</button>
                                <button type="button" class="btn btn-ghost btn-sm" id="resumeClearBtn">清除并重新开始</button>
                            </div>
                        </div>
                        <div class="resume-stage-list" id="resumeStageList">
                            <span class="resume-stage-item" data-stage="initiated">已记录交易</span>
                            <span class="resume-stage-item" data-stage="payment_verified">支付已确认</span>
                            <span class="resume-stage-item" data-stage="storage_ready">永存写入中</span>
                            <span class="resume-stage-item" data-stage="awaiting_retry">等待重试</span>
                            <span class="resume-stage-item" data-stage="published">已发布</span>
                        </div>
                    </div>
                </div>

                <button class="btn btn-ghost studio-block-button studio-step-button" id="studioPrevStepBtn">返回修改</button>
            </div>

        </div>

        <footer class="studio-footer">
            <p>
                本平台仅提供去中心化展示技术，内容由用户发布并存储于区块链/去中心化网络。请用户自行承担发布内容的法律责任。
            </p>
        </footer>
    </main>
</div>
