<!-- Payment Progress Drawer (Bottom Sheet) -->
<div class="bottom-sheet" id="paymentDrawer">
    <div class="sheet-handle"></div>

    <!-- State 1: Preview -->
    <div id="drawerPreviewMode">
        <div class="sheet-header">
            <h3 class="drawer-title">💰 支付预览</h3>
            <p class="drawer-subtitle">请确认上链信息</p>
        </div>

        <div class="drawer-summary-card">
            <p class="drawer-highlight-copy">您仅需支付 USDT（BSC），永存档案由平台负责。</p>
            <div class="drawer-summary-row">
                <span class="drawer-summary-label">支付网络</span>
                <span class="drawer-network-chip">
                    <i class="fab fa-ethereum drawer-network-icon"></i> BSC Mainnet 主网
                </span>
            </div>
            <div class="drawer-summary-row">
                <span class="drawer-summary-label">平台收款地址</span>
            </div>
            <div class="drawer-address-box" id="previewReceiveAddress">—</div>
            <div class="drawer-divider"></div>
            <div class="drawer-summary-row drawer-summary-row-amount">
                <span class="drawer-summary-label">您需支付</span>
                <div class="drawer-amount-group">
                    <div class="drawer-amount-value" id="previewAmount">Loading...</div>
                    <div class="drawer-amount-note">USDT 转至平台，永存由平台承担</div>
                </div>
            </div>
        </div>

        <div id="drawerActionArea">
            <button class="btn btn-primary drawer-block-button drawer-confirm-button" id="drawerConfirmPaymentBtn">
                🚀 确认并支付
            </button>
        </div>
        <button class="btn btn-ghost drawer-block-button drawer-cancel-button" id="drawerCancelBtn">取消</button>
    </div>

    <!-- State 2: Progress -->
    <div id="drawerProgressMode" hidden>
        <div class="sheet-header">
            <h3 class="drawer-title drawer-title-accent">⛓️ 上链进程</h3>
            <p class="drawer-subtitle">正在将怪谈永久刻入区块链</p>
        </div>

        <div class="terminal-log glass drawer-log-panel">
            <div id="loadingLogs"></div>
        </div>

        <div id="txHashDisplay" class="drawer-hash-box" hidden>
            <div class="drawer-hash-label">BSC USDT 支付交易哈希（您的付款凭证）:</div>
            <div class="drawer-hash-row">
                <code id="realTxHash" class="drawer-hash-value">Loading...</code>
                <button class="btn btn-ghost btn-sm" id="drawerCopyHashBtn">📋</button>
            </div>
        </div>

        <p class="drawer-progress-copy">
            请在钱包中确认交易...<br>
            <span class="drawer-progress-warning">后台处理中，请勿关闭页面</span>
        </p>

        <button class="btn btn-ghost btn-sm drawer-block-button" id="forceCloseLoading" hidden>强制关闭</button>
    </div>
</div>
