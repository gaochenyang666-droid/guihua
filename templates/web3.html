<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>诡境 - 创作者工作室 (Web3)</title>
    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #050508; --bg-secondary: #0f0f15; --bg-card: #15151e;
            --text-primary: #f0f0f0; --text-secondary: #888899;
            --accent-gold: #fbbf24; --accent-gold-dark: #d97706;
            --border-color: #2a2a35;
            --radius: 12px;
        }
        body {
            font-family: 'Segoe UI', sans-serif; background: var(--bg-primary); color: var(--text-primary);
            min-height: 100vh; display: flex; flex-direction: column;
        }
        
        .navbar {
            padding: 1rem 2rem; background: var(--bg-secondary); border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-size: 1.5rem; font-weight: bold; color: var(--accent-gold); text-decoration: none; display: flex; gap: 0.5rem; }
        
        .btn {
            padding: 0.6rem 1.2rem; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s;
            color: #000; background: var(--accent-gold);
        }
        .btn:hover { background: var(--accent-gold-dark); transform: translateY(-1px); }
        .btn-ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border-color); }
        .btn-ghost:hover { border-color: var(--accent-gold); color: var(--text-primary); }

        .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; flex: 1; }
        
        /* Login State */
        .login-screen { text-align: center; margin-top: 5rem; }
        .login-card {
            background: var(--bg-card); padding: 3rem; border-radius: 20px; border: 1px solid var(--border-color);
            display: inline-block; width: 100%; max-width: 400px;
        }
        
        /* Dashboard */
        .dashboard { display: none; grid-template-columns: 250px 1fr; gap: 2rem; }
        .dashboard.active { display: grid; }
        
        .profile-card { background: var(--bg-card); padding: 1.5rem; border-radius: var(--radius); border: 1px solid var(--border-color); text-align: center; }
        .avatar-placeholder { width: 80px; height: 80px; background: #333; border-radius: 50%; margin: 0 auto 1rem; display: flex; align-items: center; justify-content: center; font-size: 2rem; }
        
        .editor-card { background: var(--bg-card); padding: 2rem; border-radius: var(--radius); border: 1px solid var(--border-color); }
        .form-group { margin-bottom: 1.5rem; }
        .form-label { display: block; margin-bottom: 0.5rem; color: var(--text-secondary); font-size: 0.9rem; }
        .form-input {
            width: 100%; padding: 1rem; background: var(--bg-secondary); border: 1px solid var(--border-color);
            border-radius: 8px; color: var(--text-primary); font-size: 1rem;
        }
        .form-textarea { min-height: 200px; resize: vertical; }
        
        .toolbar { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border-color); }
        .tool-btn { background: #222; color: #fff; border: none; padding: 0.3rem 0.6rem; border-radius: 4px; cursor: pointer; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-top: 1rem; }
        .stat-item { background: var(--bg-secondary); padding: 1rem; border-radius: 8px; text-align: center; }
        .stat-val { font-size: 1.5rem; font-weight: bold; color: var(--accent-gold); }
        .stat-label { font-size: 0.8rem; color: var(--text-secondary); }

        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
        .toast { background: #333; color: #fff; padding: 1rem 2rem; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid var(--accent-gold); }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/studio" class="logo"><span>🧙‍♂️</span> 诡境工作室</a>
        <div style="display: flex; gap: 1rem;">
            <a href="/" class="btn btn-ghost">返回首页 (Web2)</a>
            <button id="navConnectBtn" class="btn" onclick="Auth.connect()">连接钱包</button>
        </div>
    </nav>

    <div class="container">
        <!-- 登录界面 -->
        <div id="loginScreen" class="login-screen">
            <div class="login-card">
                <h2 style="margin-bottom: 1rem;">Web3 创作者登录</h2>
                <p style="color: var(--text-secondary); margin-bottom: 2rem;">连接您的钱包以发布内容、铸造 NFT 勋章。</p>
                <button class="btn" style="width: 100%; font-size: 1.1rem; padding: 1rem;" onclick="Auth.connect()">🦊 MetaMask / 币安钱包</button>
            </div>
        </div>

        <!-- 工作台 -->
        <div id="dashboard" class="dashboard">
            <aside>
                <div class="profile-card">
                    <div class="avatar-placeholder">🧙‍♂️</div>
                    <h3 id="userAddrDisplay" style="margin-bottom: 0.5rem;">0x...</h3>
                    <div id="badgeDisplay" style="color: var(--accent-gold); font-size: 0.9rem; margin-bottom: 1rem; display: none;">🎖️ 资深探员</div>
                    
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-val" id="postCount">0</div>
                            <div class="stat-label">已发布</div>
                        </div>
                    </div>
                    
                    <button class="btn btn-ghost" style="width: 100%; margin-top: 1rem;" onclick="Auth.logout()">断开连接</button>
                </div>
            </aside>
            
            <main>
                <div class="editor-card">
                    <h2 style="margin-bottom: 1.5rem;">发布新怪谈</h2>
                    
                    <div class="form-group">
                        <label class="form-label">标题</label>
                        <input type="text" class="form-input" id="postTitle" placeholder="请输入引人入胜的标题...">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">正文内容</label>
                        <div class="toolbar">
                            <button class="tool-btn" onclick="Editor.format('bold')"><b>B</b></button>
                            <button class="tool-btn" onclick="Editor.format('italic')"><i>I</i></button>
                            <label class="tool-btn" style="cursor: pointer;">
                                📷 <input type="file" style="display: none;" onchange="Editor.upload(this)">
                            </label>
                        </div>
                        <div id="postContent" class="form-input form-textarea" contenteditable="true" style="overflow-y: auto;"></div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">封面图 (URL)</label>
                        <input type="text" class="form-input" id="postImage" placeholder="https://...">
                    </div>
                    
                    <div style="background: var(--bg-secondary); padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; font-size: 0.9rem; color: var(--text-secondary);">
                        <p>💰 发帖费用: <span style="color: var(--accent-gold);">0.001 tBNB</span></p>
                        <p>⛓️ 上链网络: BSC Testnet (97)</p>
                        <p>💾 存储: IPFS 永存 + 数据库映射</p>
                    </div>
                    
                    <button class="btn" style="width: 100%; padding: 1rem;" onclick="Post.publish()">⚡ 支付并发布</button>
                </div>
            </main>
        </div>
    </div>
    
    <div class="toast-container" id="toastContainer"></div>

    <script>
        const API_BASE = window.location.origin + '/api';
        let web3;
        let currentUser = null;

        const Auth = {
            async init() {
                if (localStorage.getItem('token')) await this.fetchMe();
                else this.renderState();
            },
            
            async fetchMe() {
                try {
                    const res = await fetch(`${API_BASE}/user/me`, {
                        headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                    });
                    if (res.ok) currentUser = await res.json();
                    else localStorage.removeItem('token');
                } catch(e) {}
                this.renderState();
            },

            renderState() {
                if (currentUser && currentUser.type === 'web3') {
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('dashboard').classList.add('active');
                    document.getElementById('navConnectBtn').style.display = 'none';
                    
                    const addr = currentUser.address;
                    document.getElementById('userAddrDisplay').textContent = addr.substring(0,6) + '...' + addr.substring(38);
                    document.getElementById('postCount').textContent = currentUser.posts_count;
                    
                    if (currentUser.has_nft_badge) {
                        document.getElementById('badgeDisplay').style.display = 'block';
                    }
                } else {
                    document.getElementById('loginScreen').style.display = 'block';
                    document.getElementById('dashboard').classList.remove('active');
                    document.getElementById('navConnectBtn').style.display = 'block';
                }
            },

            async connect() {
                if (typeof window.ethereum === 'undefined') return alert('请安装钱包插件');
                web3 = new Web3(window.ethereum);
                
                try {
                    const accs = await ethereum.request({ method: 'eth_requestAccounts' });
                    const address = accs[0];
                    
                    // Nonce -> Sign -> Verify
                    const nRes = await fetch(`${API_BASE}/auth/nonce?address=${address}`);
                    const nonce = (await nRes.json()).nonce;
                    
                    const msg = `欢迎来到诡境，请签名以验证身份。\n\n随机数: ${nonce}`;
                    const sig = await web3.eth.personal.sign(msg, address, '');
                    
                    const vRes = await fetch(`${API_BASE}/auth/verify`, {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ address, signature: sig, message: msg })
                    });
                    
                    const data = await vRes.json();
                    if (vRes.ok) {
                        localStorage.setItem('token', data.token);
                        currentUser = data.user; // Assuming verify returns user object now based on previous fixes
                        // If not, fetchMe()
                        if(!currentUser) await this.fetchMe();
                        else this.renderState();
                        Toast.show('登录成功');
                    } else {
                        alert(data.error);
                    }
                } catch(e) { console.error(e); alert('连接失败'); }
            },
            
            logout() {
                localStorage.removeItem('token');
                currentUser = null;
                this.renderState();
            }
        };

        const Post = {
            async publish() {
                if (!web3) web3 = new Web3(window.ethereum); // Ensure web3 init
                
                const title = document.getElementById('postTitle').value;
                const content = document.getElementById('postContent').innerHTML;
                const image = document.getElementById('postImage').value;
                
                if (!title || !content) return alert('请填写完整');

                try {
                    // Check Chain
                    const config = await (await fetch(`${API_BASE}/config/fees`)).json();
                    const chainId = await web3.eth.getChainId();
                    
                    if (Number(chainId) !== Number(config.chain_id)) {
                        await ethereum.request({
                            method: 'wallet_switchEthereumChain',
                            params: [{ chainId: web3.utils.toHex(config.chain_id) }]
                        });
                    }

                    // Pay
                    const txHash = await ethereum.request({
                        method: 'eth_sendTransaction',
                        params: [{
                            to: config.receive_address,
                            from: currentUser.address,
                            value: web3.utils.toHex(config.fee),
                            chainId: config.chain_id
                        }]
                    });
                    
                    Toast.show('交易已发送，正在上链...');
                    
                    // Save
                    const res = await fetch(`${API_BASE}/posts`, {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json', 
                            'Authorization': `Bearer ${localStorage.getItem('token')}` 
                        },
                        body: JSON.stringify({
                            title, content, tx_hash: txHash,
                            images: image ? [image] : []
                        })
                    });
                    
                    if (res.ok) {
                        Toast.show('✅ 发布成功！IPFS 永存中...');
                        document.getElementById('postTitle').value = '';
                        document.getElementById('postContent').innerHTML = '';
                        // Refresh stats
                        Auth.fetchMe();
                    } else {
                        alert((await res.json()).error);
                    }
                } catch(e) {
                    console.error(e);
                    alert('发布失败: ' + e.message);
                }
            }
        };

        const Editor = {
            format(cmd) { document.execCommand(cmd, false, null); },
            async upload(input) {
                const file = input.files[0];
                if (!file) return;
                const fd = new FormData(); fd.append('file', file);
                
                const res = await fetch(`${API_BASE}/upload`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` },
                    body: fd
                });
                if(res.ok) {
                    const data = await res.json();
                    document.execCommand('insertHTML', false, `<img src="${data.url}" style="max-width:100%; margin: 10px 0;">`);
                } else alert('上传失败');
            }
        };

        const Toast = {
            show(msg) {
                const d = document.createElement('div');
                d.className = 'toast'; d.textContent = msg;
                document.getElementById('toastContainer').appendChild(d);
                setTimeout(()=>d.remove(), 3000);
            }
        };

        window.addEventListener('load', Auth.init.bind(Auth));
    </script>
</body>
</html>
