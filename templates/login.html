<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#7c3aed">
    {% include 'partials/seo_meta.html' %}
    <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
    <link rel="shortcut icon" href="/static/logo.svg">
    <link rel="apple-touch-icon" href="/static/logo.svg">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="stylesheet" href="/static/style.css?v={{ asset_version }}">
    <script src="/static/common.js?v={{ asset_version }}"></script>
    <script src="/static/toast.js?v={{ asset_version }}"></script>
    <script src="/static/vendor/web3.min.js"></script>
    <script src="/static/vendor/walletconnect-universal-provider.umd.js"></script>
    <script src="/static/vendor/qrcode.min.js"></script>
</head>
<body>
    <nav class="navbar glass">
        <a href="/" class="logo">
            <img src="/static/logo.svg" alt="诡话" class="navbar-logo-img">
            <span>诡话</span>
        </a>
        <div class="nav-actions">
            <a href="/" class="btn btn-ghost" data-no-transition="1">返回首页</a>
        </div>
    </nav>

    <main class="container login-page-shell">
        <section class="glass login-card">
            <h2 class="login-card-title">欢迎回来</h2>
            <p class="login-card-subtitle">登录后继续查看和创作帖子。</p>

            <div id="loginModeBar" class="login-mode-bar">
                <button class="btn btn-primary btn-sm" id="modeLoginBtn" type="button">账号登录</button>
                <button class="btn btn-ghost btn-sm" id="modeRegisterBtn" type="button">注册账号</button>
                <button class="btn btn-ghost btn-sm" id="modePasswordBtn" type="button">修改密码</button>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">用户名</label>
                    <input class="form-input" id="loginUsername" type="text" maxlength="50" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <input class="form-input" id="loginPassword" type="password" autocomplete="current-password" required>
                </div>
                <button class="btn btn-primary login-submit-btn" type="submit" id="loginSubmitBtn">登录</button>
            </form>

            <form id="registerForm" hidden>
                <div class="form-group">
                    <label class="form-label">用户名</label>
                    <input class="form-input" id="registerUsername" type="text" maxlength="50" autocomplete="username">
                </div>
                <div class="form-group">
                    <label class="form-label">密码（至少 6 位）</label>
                    <input class="form-input" id="registerPassword" type="password" autocomplete="new-password">
                </div>
                <button class="btn btn-primary login-submit-btn" type="submit" id="registerSubmitBtn">创建账号并登录</button>
            </form>

            <form id="passwordForm" hidden>
                <div class="form-group">
                    <label class="form-label">用户名</label>
                    <input class="form-input" id="passwordUsername" type="text" maxlength="50" autocomplete="username">
                </div>
                <div class="form-group">
                    <label class="form-label">原密码</label>
                    <input class="form-input" id="passwordOld" type="password" autocomplete="current-password">
                </div>
                <div class="form-group">
                    <label class="form-label">新密码（至少 6 位）</label>
                    <input class="form-input" id="passwordNew" type="password" autocomplete="new-password">
                </div>
                <button class="btn btn-primary login-submit-btn" type="submit" id="passwordSubmitBtn">确认修改</button>
            </form>

            <div class="login-divider">
                <div class="login-divider-line"></div>
                <span class="login-divider-text">或</span>
                <div class="login-divider-line"></div>
            </div>

            <button class="btn btn-ghost login-submit-btn" id="walletLoginBtn" type="button">🦊 钱包登录（多种钱包）</button>
            <p class="login-help-text">如控制台出现 `inpage.js: Origin not allowed`，通常是钱包扩展自身告警，不影响本站登录逻辑。</p>
        </section>
    </main>

    <div class="modal-overlay" id="loginWalletSelectModal">
        <div class="modal glass wallet-select-modal">
            <div class="modal-header">
                <h3>连接钱包</h3>
                <button class="modal-close" type="button" id="loginWalletSelectCloseBtn">&times;</button>
            </div>
            <div id="loginWalletSelectList"></div>
            <div id="loginWalletSelectQr" class="wallet-select-qr" hidden></div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>
    <script src="/static/login.js?v={{ asset_version }}"></script>
</body>
</html>
