<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户档案 - 诡境</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0a0a0f; --bg-secondary: #12121a; --bg-card: #1a1a25;
            --text-primary: #e5e5e5; --text-secondary: #8b8b9e;
            --accent-purple: #7c3aed; --border-color: #2d2d3d;
            --radius-lg: 16px; --radius-sm: 6px;
        }
        body { background: var(--bg-primary); color: var(--text-primary); font-family: sans-serif; min-height: 100vh; }
        
        .navbar {
            padding: 1rem 1.5rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;
            background: rgba(10,10,15,0.9); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100;
        }
        .logo { font-size: 1.2rem; font-weight: bold; color: var(--accent-purple); text-decoration: none; }
        
        .container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        
        .profile-header {
            background: var(--bg-card); border-radius: 16px; padding: 2rem; border: 1px solid var(--border-color);
            display: flex; gap: 2rem; align-items: center; margin-bottom: 2rem; position: relative;
        }
        @media(max-width: 600px) { .profile-header { flex-direction: column; text-align: center; } }
        
        .avatar-lg {
            width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--accent-purple);
            display: flex; align-items: center; justify-content: center; font-size: 3rem; background: var(--bg-secondary);
        }
        
        .stats { display: flex; gap: 2rem; margin-top: 1rem; }
        .stat-item { text-align: center; }
        .stat-val { font-size: 1.2rem; font-weight: bold; color: var(--text-primary); }
        .stat-label { font-size: 0.8rem; color: var(--text-secondary); }
        
        .post-list { display: grid; gap: 1rem; }
        .post-item {
            background: var(--bg-card); padding: 1rem; border-radius: 12px; border: 1px solid var(--border-color);
            display: flex; gap: 1rem; cursor: pointer; transition: transform 0.2s;
        }
        .post-item:hover { transform: translateY(-2px); border-color: var(--accent-purple); }
        .post-cover { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; background: var(--bg-secondary); }
        
        .btn { padding: 0.5rem 1rem; border-radius: 20px; border: none; cursor: pointer; background: var(--accent-purple); color: white; }
        .btn-ghost { background: transparent; border: 1px solid var(--border-color); color: var(--text-secondary); }
        .btn-sm { padding: 0.3rem 0.8rem; font-size: 0.8rem; }

        /* Modal Styles */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85);
            display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(4px);
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--bg-card); border-radius: var(--radius-lg); width: 90%; max-width: 500px;
            max-height: 90vh; overflow-y: auto; border: 1px solid var(--border-color); padding: 1.5rem;
        }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 1rem; align-items: center; }
        .modal-close { background: none; border: none; font-size: 1.5rem; color: var(--text-secondary); cursor: pointer; }
        
        .form-group { margin-bottom: 1rem; }
        .form-label { display: block; margin-bottom: 0.4rem; font-size: 0.85rem; color: var(--text-secondary); }
        .form-input {
            width: 100%; padding: 0.75rem; background: var(--bg-secondary); border: 1px solid var(--border-color);
            border-radius: var(--radius-sm); color: var(--text-primary);
        }
        textarea.form-input { min-height: 80px; resize: vertical; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo">🔙 返回首页</a>
        <div id="myActions"></div>
    </nav>

    <div class="container">
        <div id="profileArea">加载中...</div>
        
        <h3 style="margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">发布的灵异事件</h3>
        <div id="postsArea" class="post-list"></div>
    </div>

    <!-- Edit Profile Modal -->
    <div class="modal-overlay" id="editProfileModal">
        <div class="modal">
            <div class="modal-header">
                <h3>✏️ 编辑资料</h3>
                <button class="modal-close" onclick="EditProfile.close()">&times;</button>
            </div>
            <div class="form-group" style="text-align: center;">
                <div id="previewAvatar" class="avatar-lg" style="margin: 0 auto 1rem auto;">👻</div>
                <button class="btn btn-ghost btn-sm" onclick="EditProfile.randomizeAvatar()">🎲 随机更换头像 (Emoji)</button>
            </div>
            <div class="form-group">
                <label class="form-label">昵称</label>
                <input type="text" class="form-input" id="editNickname" maxlength="50">
            </div>
            <div class="form-group">
                <label class="form-label">个人简介</label>
                <textarea class="form-input" id="editBio" maxlength="500" placeholder="写点什么..."></textarea>
            </div>
            <button class="btn" style="width: 100%;" onclick="EditProfile.save()">保存修改</button>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        let currentUser = null;
        let displayedUser = null;
        let tempAvatar = null;
        
        async function loadProfile() {
            const params = new URLSearchParams(window.location.search);
            const userParam = params.get('user');
            const token = localStorage.getItem('token');
            
            // 1. Fetch Me if logged in
            if(token) {
                try {
                    const res = await fetch(`${API_BASE}/user/me`, { headers: { 'Authorization': `Bearer ${token}` } });
                    if(res.ok) currentUser = await res.json();
                } catch(e) { console.error("Auth check failed", e); }
            }

            // 2. Determine who to show
            if(!userParam) {
                if(!currentUser) return window.location.href = '/';
                displayedUser = currentUser;
                renderProfile(currentUser, []); // Initial render
                loadUserPosts(currentUser.username);
            } else {
                try {
                    const res = await fetch(`${API_BASE}/users/${userParam}`);
                    if(!res.ok) throw new Error('User not found');
                    const data = await res.json();
                    displayedUser = data.user;
                    renderProfile(data.user, data.posts);
                } catch(e) {
                    document.getElementById('profileArea').innerHTML = `<div style="text-align:center; color:red;">${e.message}</div>`;
                }
            }
        }
        
        function renderProfile(user, posts) {
            let avatarHtml = `<img src="${user.avatar}" class="avatar-lg">`;
            if(!user.avatar || user.avatar.length < 5) {
                avatarHtml = `<div class="avatar-lg">${user.avatar || '👻'}</div>`;
            }
            
            const isMe = currentUser && currentUser.id === user.id;
            
            document.getElementById('profileArea').innerHTML = `
                <div class="profile-header">
                    ${avatarHtml}
                    <div style="flex:1;">
                        <div style="display:flex; justify-content:space-between; align-items:start;">
                            <h1 style="margin-bottom:0.5rem;">${user.nickname}</h1>
                            ${isMe ? `<button class="btn btn-ghost btn-sm" onclick="EditProfile.open()">✏️ 编辑资料</button>` : ''}
                        </div>
                        <div style="color:var(--text-secondary); font-size:0.9rem; margin-bottom:0.5rem;">
                            ${user.username} 
                            ${user.address ? `<span style="background:rgba(16,185,129,0.1); color:#10b981; padding:2px 6px; border-radius:4px; font-size:0.7rem;">${user.address.substring(0,6)}...${user.address.substring(38)}</span>` : ''}
                        </div>
                        ${user.bio ? `<div style="margin-bottom:1rem; font-size:0.9rem; color:var(--text-primary); background:var(--bg-secondary); padding:0.5rem; border-radius:8px;">${user.bio}</div>` : ''}
                        
                        <div class="stats">
                            <div class="stat-item">
                                <div class="stat-val">${user.posts_count || posts.length}</div>
                                <div class="stat-label">发帖</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-val">--</div>
                                <div class="stat-label">获赞</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            if(posts && posts.length > 0) {
                document.getElementById('postsArea').innerHTML = posts.map(p => `
                    <div class="post-item" onclick="window.location.href='/?post=${p.id}'"> 
                        ${p.cover_image ? `<img src="${p.cover_image}" class="post-cover">` : '<div class="post-cover" style="display:flex;align-items:center;justify-content:center;">📝</div>'}
                        <div style="flex:1;">
                            <div style="font-weight:bold; font-size:1.1rem; margin-bottom:0.3rem;">${p.title}</div>
                            <div style="color:var(--text-secondary); font-size:0.85rem; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">${p.content.replace(/<[^>]*>?/gm, '')}</div>
                            <div style="margin-top:0.5rem; font-size:0.8rem; color:var(--text-secondary);">
                                📅 ${new Date(p.created_at).toLocaleDateString()} · 💬 ${p.comments_count} · ❤️ ${p.likes_count}
                            </div>
                        </div>
                    </div>
                `).join('');
            } else {
                document.getElementById('postsArea').innerHTML = '<div style="text-align:center; padding:2rem; color:var(--text-secondary);">暂无发布记录</div>';
            }
        }
        
        async function loadUserPosts(username) {
             const res = await fetch(`${API_BASE}/users/${username}`);
             const data = await res.json();
             renderProfile(data.user, data.posts); // Re-render with posts
        }

        const EditProfile = {
            open() {
                if(!currentUser) return;
                document.getElementById('editNickname').value = currentUser.nickname;
                document.getElementById('editBio').value = currentUser.bio || '';
                
                // Set avatar preview
                const avatarEl = document.getElementById('previewAvatar');
                if(currentUser.avatar && currentUser.avatar.length < 5) {
                    avatarEl.innerHTML = currentUser.avatar;
                } else {
                    avatarEl.innerHTML = '👻'; // Fallback if image, but we force emoji now
                }
                
                document.getElementById('editProfileModal').classList.add('active');
            },
            
            close() {
                document.getElementById('editProfileModal').classList.remove('active');
            },
            
            randomizeAvatar() {
                const emojis = ['👻', '💀', '👽', '👾', '🤖', '🎃', '🧛', '🧟', '🧞', '🧝', '🧙', '🧚', '🧜', '👼', '👿', '👺', '👹', '🤡', '💩', '🦄'];
                const randomEmoji = emojis[Math.floor(Math.random() * emojis.length)];
                document.getElementById('previewAvatar').textContent = randomEmoji;
                tempAvatar = true; // Mark that we want to refresh
            },
            
            async save() {
                const nickname = document.getElementById('editNickname').value;
                const bio = document.getElementById('editBio').value;
                // If user clicked randomize, we send the specific emoji they saw
                const avatar = tempAvatar ? document.getElementById('previewAvatar').textContent : null;
                
                try {
                    const res = await fetch(`${API_BASE}/user/me`, {
                        method: 'PUT',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        },
                        body: JSON.stringify({
                            nickname,
                            bio,
                            avatar // Send specific emoji
                        })
                    });
                    
                    if(res.ok) {
                        const data = await res.json();
                        currentUser = data.user;
                        displayedUser = currentUser; // Since we are editing ourselves
                        renderProfile(currentUser, []); // We might lose posts here if we don't keep them, but loadUserPosts will fix or we can pass [] and reload
                        loadUserPosts(currentUser.username); // Reload posts to be safe
                        this.close();
                        tempAvatar = false;
                    } else {
                        alert('更新失败');
                    }
                } catch(e) {
                    console.error(e);
                    alert('网络错误');
                }
            }
        };

        window.onload = loadProfile;
    </script>
</body>
</html>
