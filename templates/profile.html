<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#7c3aed">
    <title>用户档案 - 诡话</title>
    <link rel="icon" type="image/png" href="/static/default-avatar.png">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
</head>
<body>
    <nav class="navbar glass">
        <a href="/" class="logo">🔙 返回首页</a>
        <div id="myActions"></div>
    </nav>

    <div class="container" style="max-width: 800px; margin: 2rem auto; padding: 0 1rem;">
        <div id="profileArea" class="glass" style="border-radius: var(--radius-lg); margin-bottom: 2rem;">加载中...</div>
        
        <h3 style="margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">发布的灵异事件</h3>
        <div id="postsArea" class="post-list"></div>
    </div>

    <!-- Edit Profile Modal -->
    <div class="modal-overlay" id="editProfileModal">
        <div class="modal glass">
            <div class="modal-header">
                <h3>✏️ 编辑资料</h3>
                <button class="modal-close" onclick="EditProfile.close()">&times;</button>
            </div>
            <div class="form-group" style="text-align: center;">
                <div id="previewAvatar" class="avatar-lg" style="margin: 0 auto 1rem auto;">👻</div>
                <button class="btn btn-ghost btn-sm" onclick="EditProfile.randomizeAvatar()">🎲 随机更换头像 (Emoji)</button>
            </div>
            <div class="form-group">
                <label class="form-label">昵称</label>
                <input type="text" class="form-input" id="editNickname" maxlength="50">
            </div>
            <div class="form-group">
                <label class="form-label">个人简介</label>
                <textarea class="form-input" id="editBio" maxlength="500" placeholder="写点什么..."></textarea>
            </div>
            <button class="btn btn-primary" style="width: 100%;" onclick="EditProfile.save()">保存修改</button>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        let currentUser = null;
        let displayedUser = null;
        let tempAvatar = null;
        
        async function loadProfile() {
            const params = new URLSearchParams(window.location.search);
            const userParam = params.get('user');
            const token = localStorage.getItem('token');
            
            if(token) {
                try {
                    const res = await fetch(`${API_BASE}/user/me`, { headers: { 'Authorization': `Bearer ${token}` } });
                    if(res.ok) currentUser = await res.json();
                } catch(e) { console.error("Auth check failed", e); }
            }

            if(!userParam) {
                if(!currentUser) return window.location.href = '/';
                displayedUser = currentUser;
                renderProfile(currentUser, []); 
                loadUserPosts(currentUser.username);
            } else {
                try {
                    const res = await fetch(`${API_BASE}/users/${userParam}`);
                    if(!res.ok) throw new Error('User not found');
                    const data = await res.json();
                    displayedUser = data.user;
                    renderProfile(data.user, data.posts);
                } catch(e) {
                    document.getElementById('profileArea').innerHTML = `<div style="text-align:center; color:red; padding: 2rem;">${e.message}</div>`;
                }
            }
        }
        
        function renderProfile(user, posts) {
            let avatarHtml = `<img src="${user.avatar}" class="avatar-lg">`;
            if(!user.avatar || user.avatar.length < 5) {
                avatarHtml = `<div class="avatar-lg">${user.avatar || '👻'}</div>`;
            }
            
            const isMe = currentUser && currentUser.id === user.id;
            
            document.getElementById('profileArea').innerHTML = `
                <div class="profile-header" style="border:none; margin:0; background:transparent;">
                    ${avatarHtml}
                    <div style="flex:1;">
                        <div style="display:flex; justify-content:space-between; align-items:start;">
                            <h1 style="margin-bottom:0.5rem;">${user.nickname}</h1>
                            ${isMe ? `<button class="btn btn-ghost btn-sm" onclick="EditProfile.open()">✏️ 编辑资料</button>` : ''}
                        </div>
                        <div style="color:var(--text-secondary); font-size:0.9rem; margin-bottom:0.5rem;">
                            ${user.username} 
                            ${user.address ? `<span style="background:rgba(16,185,129,0.1); color:#10b981; padding:2px 6px; border-radius:4px; font-size:0.7rem;">${user.address.substring(0,6)}...${user.address.substring(38)}</span>` : ''}
                        </div>
                        ${user.bio ? `<div style="margin-bottom:1rem; font-size:0.9rem; color:var(--text-primary); background:rgba(255,255,255,0.05); padding:0.5rem; border-radius:8px;">${user.bio}</div>` : ''}
                        
                        <div class="stats">
                            <div class="stat-item">
                                <div class="stat-val">${user.posts_count || posts.length}</div>
                                <div class="stat-label">发帖</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-val">--</div>
                                <div class="stat-label">获赞</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            if(posts && posts.length > 0) {
                document.getElementById('postsArea').innerHTML = posts.map(p => `
                    <div class="post-item glass" onclick="window.location.href='/?post=${p.id}'"> 
                        ${p.cover_image ? `<img src="${p.cover_image}" class="post-cover" loading="lazy">` : '<div class="post-cover" style="display:flex;align-items:center;justify-content:center;font-size:2rem;">📝</div>'}
                        <div style="flex:1;">
                            <div style="font-weight:bold; font-size:1.1rem; margin-bottom:0.3rem;">${p.title}</div>
                            <div style="color:var(--text-secondary); font-size:0.85rem; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">${p.content.replace(/<[^>]*>?/gm, '')}</div>
                            <div style="margin-top:0.5rem; font-size:0.8rem; color:var(--text-secondary);">
                                📅 ${new Date(p.created_at).toLocaleDateString()} · 💬 ${p.comments_count} · ❤️ ${p.likes_count}
                            </div>
                        </div>
                    </div>
                `).join('');
            } else {
                document.getElementById('postsArea').innerHTML = '<div style="text-align:center; padding:2rem; color:var(--text-secondary);">暂无发布记录</div>';
            }
        }
        
        async function loadUserPosts(username) {
             const res = await fetch(`${API_BASE}/users/${username}`);
             const data = await res.json();
             renderProfile(data.user, data.posts); 
        }

        const EditProfile = {
            open() {
                if(!currentUser) return;
                document.getElementById('editNickname').value = currentUser.nickname;
                document.getElementById('editBio').value = currentUser.bio || '';
                
                const avatarEl = document.getElementById('previewAvatar');
                if(currentUser.avatar && currentUser.avatar.length < 5) {
                    avatarEl.innerHTML = currentUser.avatar;
                } else {
                    avatarEl.innerHTML = '👻'; 
                }
                
                document.getElementById('editProfileModal').classList.add('active');
            },
            
            close() {
                document.getElementById('editProfileModal').classList.remove('active');
            },
            
            randomizeAvatar() {
                const emojis = ['👻', '💀', '👽', '👾', '🤖', '🎃', '🧛', '🧟', '🧞', '🧝', '🧙', '🧚', '🧜', '👼', '👿', '👺', '👹', '🤡', '💩', '🦄'];
                const randomEmoji = emojis[Math.floor(Math.random() * emojis.length)];
                document.getElementById('previewAvatar').textContent = randomEmoji;
                tempAvatar = true; 
            },
            
            async save() {
                const nickname = document.getElementById('editNickname').value;
                const bio = document.getElementById('editBio').value;
                const avatar = tempAvatar ? document.getElementById('previewAvatar').textContent : null;
                
                try {
                    const res = await fetch(`${API_BASE}/user/me`, {
                        method: 'PUT',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        },
                        body: JSON.stringify({
                            nickname,
                            bio,
                            avatar
                        })
                    });
                    
                    if(res.ok) {
                        const data = await res.json();
                        currentUser = data.user;
                        displayedUser = currentUser; 
                        renderProfile(currentUser, []); 
                        loadUserPosts(currentUser.username); 
                        this.close();
                        tempAvatar = false;
                    } else {
                        alert('更新失败');
                    }
                } catch(e) {
                    console.error(e);
                    alert('网络错误');
                }
            }
        };

        window.onload = loadProfile;
    </script>
</body>
</html>
