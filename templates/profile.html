<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#7c3aed">
    <title>用户档案 - 诡话</title>
    <!-- Favicon 统一使用 logo.svg，适配桌面与移动端 -->
    <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
    <link rel="shortcut icon" href="/static/logo.svg">
    <link rel="apple-touch-icon" href="/static/logo.svg">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/static/common.js"></script>
    <script src="/static/toast.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
</head>
<body>
    <nav class="navbar glass">
        <a href="/" class="logo">
            <img src="/static/logo.svg" alt="诡话" class="navbar-logo-img">
            <span>诡话</span>
        </a>
        <div id="myActions"></div>
    </nav>

    <div class="container" style="max-width: 800px; margin: 2rem auto; padding: 0 1rem;">
        <div id="profileArea" class="glass" style="border-radius: var(--radius-lg); margin-bottom: 2rem;">加载中...</div>
        <div id="tipThanksArea" class="glass" style="border-radius: var(--radius-lg); margin-bottom: 1.2rem; padding: 1rem; display:none;"></div>
        <div id="seriesArea" class="glass" style="border-radius: var(--radius-lg); margin-bottom: 1.2rem; padding: 1rem; display:none;"></div>
        <h3 style="margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">发布的灵异事件</h3>
        <div id="postsArea" class="post-list"></div>
    </div>

    <!-- Edit Profile Modal -->
    <div class="modal-overlay" id="editProfileModal">
        <div class="modal glass">
            <div class="modal-header">
                <h3>✏️ 编辑资料</h3>
                <button class="modal-close" onclick="EditProfile.close()">&times;</button>
            </div>
            <div class="form-group" style="text-align: center;">
                <div id="previewAvatar" class="avatar-lg" style="margin: 0 auto 1rem auto;">👻</div>
                <button class="btn btn-ghost btn-sm" onclick="EditProfile.randomizeAvatar()">🎲 随机生成鬼魂头像</button>
            </div>
            <div class="form-group">
                <label class="form-label">昵称</label>
                <input type="text" class="form-input" id="editNickname" maxlength="50">
            </div>
            <div class="form-group">
                <label class="form-label">个人简介</label>
                <textarea class="form-input" id="editBio" maxlength="500" placeholder="写点什么..."></textarea>
            </div>
            <button class="btn btn-primary" style="width: 100%;" onclick="EditProfile.save()">保存修改</button>
        </div>
    </div>

    <!-- Change Password Modal (logged-in, Web2 only) -->
    <div class="modal-overlay" id="changePasswordModal" onclick="EditProfile.closeChangePassword()">
        <div class="modal glass" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3>🔒 修改密码</h3>
                <button class="modal-close" onclick="EditProfile.closeChangePassword()">&times;</button>
            </div>
            <div class="form-group">
                <label class="form-label">当前密码</label>
                <input type="password" class="form-input" id="cpOldPasswordIn" placeholder="当前密码">
            </div>
            <div class="form-group">
                <label class="form-label">新密码</label>
                <input type="password" class="form-input" id="cpNewPasswordIn" placeholder="新密码">
            </div>
            <div class="form-group">
                <label class="form-label">确认新密码</label>
                <input type="password" class="form-input" id="cpConfirmPasswordIn" placeholder="再输入一次">
            </div>
            <button class="btn btn-primary" style="width: 100%;" onclick="EditProfile.submitChangePassword()">确认修改</button>
        </div>
    </div>

    <div class="modal-overlay" id="achievementsModal" onclick="Achievements.closeWall()" style="align-items:flex-start; overflow-y:auto; padding:calc(var(--nav-height) + 8px) 0 12px;">
        <div class="modal glass" style="width:min(760px, 94vw); max-width:760px; max-height: calc(100vh - var(--nav-height) - 28px); overflow: hidden; display: flex; flex-direction: column; margin:0 auto;" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3>🏆 成就安装墙</h3>
                <button class="modal-close" onclick="Achievements.closeWall()">&times;</button>
            </div>
            <div id="achievementsWallBody" style="overflow:auto; flex:1; padding-right:0.2rem;">加载中...</div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin + '/api';
        let currentUser = null;
        let displayedUser = null;
        let displayedPosts = [];
        let displayedSeries = [];
        let tempAvatar = null;
        let myAchievementsState = null;
        const ACHIEVEMENT_META = {
            report_privilege: { title: '举报权限', min_level: 2, wearable: false },
            wearable_unlock: { title: '成就佩戴权限', min_level: 3, wearable: false },
            co_create_group: { title: '共创群资格', min_level: 5, wearable: true },
            core_group: { title: '核心群资格', min_level: 10, wearable: true }
        };
        const escapeAttr = (s) => (s == null ? '' : String(s))
            .replace(/&/g, '&amp;')
            .replace(/"/g, '&quot;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');

        function achievementTitleByKey(key) {
            if (!key) return '';
            if (myAchievementsState && Array.isArray(myAchievementsState.achievements)) {
                const found = myAchievementsState.achievements.find((a) => a && a.key === key);
                if (found && found.title) return found.title;
            }
            const m = ACHIEVEMENT_META[key];
            return m ? m.title : key;
        }

        async function copyWalletAddress(address) {
            const val = (address || '').trim();
            if (!val) return;
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(val);
                } else {
                    const ta = document.createElement('textarea');
                    ta.value = val;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.focus();
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                }
                if (typeof Toast !== 'undefined') Toast.success('打赏地址已复制');
            } catch (_) {
                if (typeof Toast !== 'undefined') Toast.error('复制失败，请手动复制');
            }
        }
        window.copyWalletAddress = copyWalletAddress;

        function resolvePostCoverUrl(post) {
            const normalize = (val) => {
                if (typeof val !== 'string') return null;
                const trimmed = val.trim();
                if (!trimmed || trimmed === '/static/images/hua_cover.jpg') return null;
                return trimmed;
            };
            const direct = normalize(post && post.cover_image);
            if (direct) return direct;
            const images = post && post.images;
            if (Array.isArray(images)) {
                for (const it of images) {
                    const found = normalize(it);
                    if (found) return found;
                }
            }
            return null;
        }

        function renderPostCover(post) {
            const coverUrl = resolvePostCoverUrl(post);
            if (!coverUrl) {
                return '<div class="post-cover-wrap is-fallback"><div class="post-cover-placeholder">📝</div></div>';
            }
            return `<div class="post-cover-wrap">
                <div class="post-cover-placeholder">📝</div>
                <img src="${escapeAttr(coverUrl)}" class="post-cover" loading="lazy" decoding="async" referrerpolicy="no-referrer" onload="this.parentElement.classList.add('has-image')" onerror="this.remove();this.parentElement.classList.remove('has-image')">
            </div>`;
        }

        async function loadProfile() {
            const params = new URLSearchParams(window.location.search);
            const userParam = params.get('user');
            const token = localStorage.getItem('token');
            
            if(token) {
                try {
                    const res = await fetch(`${API_BASE}/user/me`, { headers: { 'Authorization': `Bearer ${token}` } });
                    if(res.ok) {
                        currentUser = await res.json();
                    } else {
                        if(res.status === 401) localStorage.removeItem('token');
                    }
                } catch(e) { console.error("Auth check failed", e); }
            }

            if(!userParam) {
                if(!currentUser) { navigateWithTransition('/'); return; }
                displayedUser = currentUser;
                renderProfile(currentUser, [], []);
                loadAchievements();
                loadUserPosts(currentUser.username || currentUser.address);
            } else {
                try {
                    const res = await fetch(`${API_BASE}/users/${userParam}`);
                    const data = await res.json().catch(() => ({}));
                    if(!res.ok) {
                        showProfileError(data.error || '用户不存在或已注销', true);
                        return;
                    }
                    displayedUser = data.user;
                    renderProfile(data.user, data.posts, data.series || []);
                    if (currentUser && data.user && data.user.id === currentUser.id) {
                        loadAchievements();
                    }
                } catch(e) {
                    showProfileError(e.message || '加载失败', true);
                }
            }
        }

        function showProfileError(msg, showBack) {
            const backHtml = showBack ? '<p style="margin-top:1rem;"><a href="/" class="btn btn-primary">返回首页</a></p>' : '';
            document.getElementById('profileArea').innerHTML = `<div style="text-align:center; padding: 2rem; color: var(--text-secondary);"><p style="color:var(--accent-red); margin-bottom:0.5rem;">${msg}</p>${backHtml}</div>`;
        }

        function renderAchievementWallBody() {
            const wall = document.getElementById('achievementsWallBody');
            if (!wall) return;
            const state = myAchievementsState;
            if (!state || !Array.isArray(state.achievements)) {
                wall.innerHTML = '<div style="color:var(--text-muted); padding:0.8rem;">暂无成就数据</div>';
                return;
            }
            const canEquip = !!state.can_equip;
            const isAdminInfinite = !!state.admin_infinite_level;
            const cards = state.achievements.map((a) => {
                const unlocked = !!a.unlocked;
                const wearable = !!a.wearable;
                const legacy = !!a.legacy;
                const lockedText = unlocked ? '已解锁' : (legacy ? '未解锁' : `Lv.${a.min_level} 解锁`);
                let actionHtml = '';
                if (a.key === 'report_privilege') {
                    actionHtml = unlocked
                        ? '<button class="btn btn-ghost btn-sm" style="border-color:var(--accent-red); color:var(--accent-red);" onclick="Achievements.quickReport()">快速举报</button>'
                        : '<span style="font-size:0.78rem; color:var(--text-muted);">等级不足，无法举报</span>';
                } else if (wearable) {
                    if (!unlocked) {
                        actionHtml = `<span style="font-size:0.78rem; color:var(--text-muted);">${legacy ? '尚未满足解锁条件' : '未达佩戴等级'}</span>`;
                    } else if (!canEquip) {
                        actionHtml = '<span style="font-size:0.78rem; color:var(--text-muted);">Lv.3 解锁佩戴按钮</span>';
                    } else if (a.equipped) {
                        actionHtml = `<button class="btn btn-primary btn-sm" onclick="Achievements.equip('')">取消佩戴</button>`;
                    } else {
                        actionHtml = `<button class="btn btn-ghost btn-sm" onclick="Achievements.equip('${escapeAttr(a.key)}')">佩戴</button>`;
                    }
                } else if (a.key === 'wearable_unlock') {
                    actionHtml = unlocked
                        ? '<span style="font-size:0.78rem; color:var(--accent-green);">已解锁佩戴能力</span>'
                        : '<span style="font-size:0.78rem; color:var(--text-muted);">Lv.3 解锁</span>';
                }
                return `
                    <div style="padding:0.75rem; border:1px solid ${unlocked ? 'rgba(16,185,129,0.35)' : 'var(--border-color)'}; border-radius:12px; background:${unlocked ? 'rgba(16,185,129,0.08)' : 'rgba(255,255,255,0.02)'};">
                        <div style="display:flex; justify-content:space-between; align-items:center; gap:0.5rem; margin-bottom:0.35rem;">
                            <b>${escapeHtml(a.title || '')}</b>
                            <span style="font-size:0.74rem; color:${unlocked ? 'var(--accent-green)' : 'var(--text-muted)'};">${legacy ? '旧成就 · ' : ''}${lockedText}</span>
                        </div>
                        <div style="font-size:0.82rem; color:var(--text-secondary); margin-bottom:0.55rem;">${escapeHtml(a.description || '')}</div>
                        <div>${actionHtml}</div>
                    </div>
                `;
            }).join('');
            const equippedTitle = achievementTitleByKey(state.equipped_key);
            wall.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; gap:0.5rem; margin-bottom:0.8rem; flex-wrap:wrap;">
                    <h3>🏆 我的成就安装墙</h3>
                    <span style="font-size:0.8rem; color:var(--text-secondary);">当前佩戴：${equippedTitle ? `<span style="color:var(--accent-gold);">${escapeHtml(equippedTitle)}</span>` : '未佩戴'}</span>
                </div>
                <div style="font-size:0.82rem; color:var(--text-secondary); margin-bottom:0.7rem;">当前等级：${isAdminInfinite ? '<span style="color:var(--accent-gold);">∞（管理员）</span>' : escapeHtml(state.level_label || ('Lv.' + state.level))}</div>
                <div style="display:grid; gap:0.7rem;">${cards}</div>
            `;
        }

        async function loadAchievements() {
            if (!currentUser) return;
            try {
                const res = await fetch(`${API_BASE}/achievements`, {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) return;
                myAchievementsState = data;
                renderAchievementWallBody();
                if (displayedUser && currentUser && displayedUser.id === currentUser.id) {
                    renderProfile(displayedUser, displayedPosts);
                }
            } catch (_) {}
        }
        
        async function loadTipThanks(userId, canShow, showAmount) {
            const area = document.getElementById('tipThanksArea');
            if (!area) return;
            if (!canShow) {
                area.style.display = 'none';
                area.innerHTML = '';
                return;
            }
            area.style.display = 'block';
            area.innerHTML = '加载感谢名单...';
            try {
                const qs = new URLSearchParams({ page: '1', per_page: '24' });
                if (showAmount) qs.append('show_amount', '1');
                const token = localStorage.getItem('token');
                const headers = token ? { 'Authorization': `Bearer ${token}` } : {};
                const res = await fetch(`${API_BASE}/users/${userId}/tips-received?${qs.toString()}`, { headers });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    area.innerHTML = `<div style="color:var(--text-muted);">${escapeHtml(data.error || '该用户未公开感谢名单')}</div>`;
                    return;
                }
                const items = data.items || [];
                if (!items.length) {
                    area.innerHTML = '<div style="color:var(--text-muted);">暂无打赏记录</div>';
                    return;
                }
                area.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; gap:0.5rem; margin-bottom:0.6rem;">
                        <b>🙏 感谢名单</b>
                        <span style="font-size:0.78rem; color:var(--text-muted);">最近 ${items.length} 条</span>
                    </div>
                    <div style="display:flex; flex-wrap:wrap; gap:0.4rem;">
                        ${items.map((it) => {
                            const nick = (it.from_user && it.from_user.nickname) || '匿名用户';
                            const amount = (typeof it.amount_usdt !== 'undefined') ? ` · ${Number(it.amount_usdt).toFixed(2)} USDT` : '';
                            return `<span style="padding:0.2rem 0.45rem; border:1px solid var(--border-color); border-radius:999px; font-size:0.8rem;">${escapeHtml(nick)}${escapeHtml(amount)}</span>`;
                        }).join('')}
                    </div>
                `;
            } catch (_) {
                area.innerHTML = '<div style="color:var(--text-muted);">加载失败</div>';
            }
        }

        function renderSeriesList(seriesList) {
            const area = document.getElementById('seriesArea');
            if (!area) return;
            const list = Array.isArray(seriesList) ? seriesList : [];
            if (!list.length) {
                area.style.display = 'none';
                area.innerHTML = '';
                return;
            }
            area.style.display = 'block';
            area.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; gap:0.5rem; margin-bottom:0.6rem;">
                    <b>📚 系列 / 合集</b>
                    <span style="font-size:0.78rem; color:var(--text-muted);">${list.length} 个系列</span>
                </div>
                <div style="display:grid; gap:0.5rem;">
                    ${list.map((s) => `<a href="/series/${s.id}" class="btn btn-ghost btn-sm" data-no-transition="1" style="justify-content:space-between; text-decoration:none;"><span>${escapeHtml(s.title || '')}</span><span style="font-size:0.74rem; color:var(--text-muted);">查看目录</span></a>`).join('')}
                </div>
            `;
        }

        function renderProfile(user, posts, seriesList) {
            displayedPosts = Array.isArray(posts) ? posts : [];
            displayedSeries = Array.isArray(seriesList) ? seriesList : displayedSeries;
            // Always render emoji avatar
            let avatarHtml = `<div class="avatar-lg">${user.avatar || '👻'}</div>`;
            const walletAddress = ((user.wallet_address || user.address || '') + '').trim();
            const walletAddressBtn = walletAddress
                ? `<button type="button" class="btn btn-ghost btn-sm" style="background:rgba(16,185,129,0.1); color:#10b981; border-color:rgba(16,185,129,0.4); min-height:24px; padding:2px 8px; font-size:0.72rem;" title="点击复制打赏地址" onclick="copyWalletAddress('${escapeAttr(walletAddress)}')">打赏地址: ${escapeHtml(walletAddress.substring(0,6) + '...' + walletAddress.slice(-4))}</button>`
                : '';
            
            const isMe = currentUser && currentUser.id === user.id;
            const showTipThanks = !!user.show_tip_thanks;
            
            document.getElementById('profileArea').innerHTML = `
                <div class="profile-header" style="border:none; margin:0; background:transparent;">
                    ${avatarHtml}
                    <div style="flex:1;">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                            <h1 style="margin-bottom:0.5rem; display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap;">
                                <span>${escapeHtml(user.nickname)}</span>
                                ${user.equipped_achievement_key
                                    ? `<span class="honor-badge" style="border-color:rgba(16,185,129,0.5); color:var(--accent-green);">🏆 ${escapeHtml(achievementTitleByKey(user.equipped_achievement_key))}</span>`
                                    : (user.honor_title ? `<span class="honor-badge">🏷 ${escapeHtml(user.honor_title)}</span>` : '')}
                            </h1>
                            ${isMe ? `<div style="display:flex; gap:0.5rem; flex-wrap:wrap;"><button class="btn btn-ghost btn-sm" onclick="Achievements.openWall()">🏆 成就墙</button><button class="btn btn-ghost btn-sm" onclick="EditProfile.open()">✏️ 编辑资料</button>${currentUser.username ? `<button class="btn btn-ghost btn-sm" onclick="EditProfile.openChangePassword()">🔒 修改密码</button>` : ''}</div>` : ''}
                        </div>
                        <div style="color:var(--text-secondary); font-size:0.9rem; margin-bottom:0.5rem; display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap;">
                            ${user.username ? user.username + ' · ' : ''}
                            ${typeof user.id !== 'undefined' ? formatUserId(user.id) : ''}
                            ${walletAddressBtn}
                        </div>
                        ${user.bio ? `<div style="margin-bottom:1rem; font-size:0.9rem; color:var(--text-primary); background:rgba(255,255,255,0.05); padding:0.5rem; border-radius:8px;">${escapeHtml(user.bio)}</div>` : ''}
                        <div style="color:var(--text-secondary); font-size:0.82rem; margin-bottom:0.8rem;">${user.admin_infinite_level ? '🛡️ 管理员免签到（无限等级）' : ('📅 连续签到 ' + Number(user.checkin_streak || 0) + ' 天')}</div>
                        ${isMe ? `<label style="display:flex; align-items:center; gap:0.45rem; margin-bottom:0.8rem; color:var(--text-secondary); font-size:0.82rem;"><input type="checkbox" id="showTipThanksToggle" ${showTipThanks ? 'checked' : ''}> 公开展示感谢名单</label>` : ''}
                        
                        <div class="stats">
                            <div class="stat-item">
                                <div class="stat-val">${user.posts_count || posts.length}</div>
                                <div class="stat-label">发帖</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-val">${user.likes_count || 0}</div>
                                <div class="stat-label">获赞</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-val">${escapeHtml(user.level_label || ('Lv.' + Math.max(1, Number(user.level || 1))))}</div>
                                <div class="stat-label">等级</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-val">${Number(user.experience_points || 0)}</div>
                                <div class="stat-label">经验</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            if (isMe) {
                const toggle = document.getElementById('showTipThanksToggle');
                if (toggle) {
                    toggle.onchange = async function () {
                        try {
                            const res = await fetch(`${API_BASE}/user/settings`, {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('token')}` },
                                body: JSON.stringify({ show_tip_thanks: !!toggle.checked })
                            });
                            const data = await res.json().catch(() => ({}));
                            if (!res.ok) {
                                if (typeof Toast !== 'undefined') Toast.error(data.error || '保存失败');
                                toggle.checked = !toggle.checked;
                                return;
                            }
                            if (currentUser) currentUser.show_tip_thanks = !!toggle.checked;
                            if (displayedUser) displayedUser.show_tip_thanks = !!toggle.checked;
                            loadTipThanks(user.id, true, true);
                        } catch (_) {
                            if (typeof Toast !== 'undefined') Toast.error('网络错误');
                            toggle.checked = !toggle.checked;
                        }
                    };
                }
            }
            loadTipThanks(user.id, isMe || showTipThanks, isMe);
            renderSeriesList(displayedSeries);
            if(displayedPosts && displayedPosts.length > 0) {
                const proofLink = (p) => {
                    const parts = [];
                    if (p.tx_hash) parts.push('<a href="https://bscscan.com/tx/' + p.tx_hash + '" target="_blank" rel="noopener" style="color:var(--accent-purple);">⛓ 支付凭证</a>');
                    if (p.ipfs_cid) parts.push('<a href="https://arweave.net/' + p.ipfs_cid + '" target="_blank" rel="noopener" style="color:var(--accent-gold);">💾 永存档案</a>');
                    return parts.length ? '<div style="margin-top:0.4rem; font-size:0.75rem;">链上证据: ' + parts.join(' · ') + '</div>' : '';
                };
                document.getElementById('postsArea').innerHTML = displayedPosts.map(p => `
                    <div class="post-item glass" onclick="navigateWithTransition('/?post=${p.id}')"> 
                        ${renderPostCover(p)}
                        <div style="flex:1;">
                            <div style="font-weight:bold; font-size:1.1rem; margin-bottom:0.3rem;">${escapeHtml(p.title)}</div>
                            <div style="color:var(--text-secondary); font-size:0.85rem; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">${escapeHtml((p.content || '').replace(/<[^>]*>?/gm, ''))}</div>
                            <div style="margin-top:0.5rem; font-size:0.8rem; color:var(--text-secondary);">
                                📅 ${new Date(p.created_at).toLocaleDateString()} · 💬 ${p.comments_count} · ❤️ ${p.likes_count}
                            </div>
                            ${proofLink(p)}
                        </div>
                    </div>
                `).join('');
            } else {
                document.getElementById('postsArea').innerHTML = '<div style="text-align:center; padding:2rem; color:var(--text-secondary);">暂无发布记录</div>';
            }
        }
        
        async function loadUserPosts(username) {
            try {
                const res = await fetch(`${API_BASE}/users/${username}`);
                const data = await res.json().catch(() => ({}));
                if(!res.ok) {
                    if(res.status === 401) localStorage.removeItem('token');
                    showProfileError(data.error || '用户不存在或已注销', true);
                    return;
                }
                if(data.user) {
                    displayedUser = data.user;
                    renderProfile(data.user, data.posts || [], data.series || []);
                    if (currentUser && data.user && data.user.id === currentUser.id) {
                        loadAchievements();
                    }
                }
            } catch(e) {
                showProfileError('加载帖子失败', true);
            }
        }

        const Achievements = {
            openWall() {
                const modal = document.getElementById('achievementsModal');
                if (!modal) return;
                modal.classList.add('active');
                const wallBody = document.getElementById('achievementsWallBody');
                if (wallBody) wallBody.scrollTop = 0;
                renderAchievementWallBody();
                if (!myAchievementsState) loadAchievements();
            },
            closeWall() {
                const modal = document.getElementById('achievementsModal');
                if (!modal) return;
                modal.classList.remove('active');
            },
            async equip(key) {
                if (!currentUser) return;
                try {
                    const res = await fetch(`${API_BASE}/achievements/equip`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        },
                        body: JSON.stringify({ key: key || '' })
                    });
                    const data = await res.json().catch(() => ({}));
                    if (!res.ok) {
                        if (typeof Toast !== 'undefined') Toast.error(data.error || '操作失败');
                        return;
                    }
                    myAchievementsState = data.status || null;
                    if (myAchievementsState && myAchievementsState.equipped_key !== undefined) {
                        currentUser.equipped_achievement_key = myAchievementsState.equipped_key || null;
                        if (displayedUser && displayedUser.id === currentUser.id) {
                            displayedUser.equipped_achievement_key = currentUser.equipped_achievement_key;
                        }
                    }
                    if (displayedUser && displayedUser.id === currentUser.id) {
                        renderProfile(displayedUser, displayedPosts);
                    }
                    renderAchievementWallBody();
                    if (typeof Toast !== 'undefined') Toast.success(data.message || '佩戴状态已更新');
                } catch (_) {
                    if (typeof Toast !== 'undefined') Toast.error('网络错误');
                }
            },
            async quickReport() {
                if (!currentUser) return;
                const reason = prompt('可选：补充举报说明（最多 460 字）') || '';
                try {
                    const res = await fetch(`${API_BASE}/reports/priority`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        },
                        body: JSON.stringify({ reason: reason.trim() })
                    });
                    const data = await res.json().catch(() => ({}));
                    if (!res.ok) {
                        if (typeof Toast !== 'undefined') Toast.error(data.error || '提交失败');
                        return;
                    }
                    if (typeof Toast !== 'undefined') Toast.success(data.message || '已提交举报');
                } catch (_) {
                    if (typeof Toast !== 'undefined') Toast.error('网络错误');
                }
            }
        };
        window.Achievements = Achievements;

        const EditProfile = {
            open() {
                if(!currentUser) return;
                document.getElementById('editNickname').value = currentUser.nickname;
                document.getElementById('editBio').value = currentUser.bio || '';
                
                const avatarEl = document.getElementById('previewAvatar');
                avatarEl.innerHTML = currentUser.avatar || '👻';
                
                document.getElementById('editProfileModal').classList.add('active');
            },
            
            close() {
                document.getElementById('editProfileModal').classList.remove('active');
            },
            
            randomizeAvatar() {
                const emojis = ['👻', '💀', '👽', '👾', '🤖', '🎃', '🧛', '🧟', '🧞', '🧝', '🧙', '🧚', '🧜', '👼', '👿', '👺', '👹', '🤡', '💩', '🦄'];
                const randomEmoji = emojis[Math.floor(Math.random() * emojis.length)];
                document.getElementById('previewAvatar').textContent = randomEmoji;
                tempAvatar = true; 
            },
            
            async save() {
                const nickname = document.getElementById('editNickname').value;
                const bio = document.getElementById('editBio').value;
                // Only use the emoji from the preview
                let avatar = document.getElementById('previewAvatar').textContent;

                try {
                    const res = await fetch(`${API_BASE}/user/me`, {
                        method: 'PUT',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        },
                        body: JSON.stringify({
                            nickname,
                            bio,
                            avatar
                        })
                    });
                    
                    if(res.ok) {
                        const data = await res.json();
                        currentUser = data.user;
                        displayedUser = currentUser; 
                        renderProfile(currentUser, []); 
                        loadUserPosts(currentUser.username || currentUser.address); 
                        this.close();
                        tempAvatar = false;
                    } else {
                        if (typeof Toast !== 'undefined') Toast.error('更新失败'); else alert('更新失败');
                    }
                } catch(e) {
                    console.error(e);
                    if (typeof Toast !== 'undefined') Toast.error('网络错误'); else alert('网络错误');
                }
            },
            openChangePassword() {
                document.getElementById('cpOldPasswordIn').value = '';
                document.getElementById('cpNewPasswordIn').value = '';
                document.getElementById('cpConfirmPasswordIn').value = '';
                document.getElementById('changePasswordModal').classList.add('active');
            },
            closeChangePassword() {
                document.getElementById('changePasswordModal').classList.remove('active');
            },
            async submitChangePassword() {
                const oldP = document.getElementById('cpOldPasswordIn').value;
                const newP = document.getElementById('cpNewPasswordIn').value;
                const confirmP = document.getElementById('cpConfirmPasswordIn').value;
                if (!oldP || !newP) {
                    if (typeof Toast !== 'undefined') Toast.error('请填写当前密码和新密码'); else alert('请填写当前密码和新密码');
                    return;
                }
                if (newP !== confirmP) {
                    if (typeof Toast !== 'undefined') Toast.error('两次新密码不一致'); else alert('两次新密码不一致');
                    return;
                }
                if (newP.length < 6) {
                    if (typeof Toast !== 'undefined') Toast.error('新密码至少6位'); else alert('新密码至少6位');
                    return;
                }
                try {
                    const res = await fetch(`${API_BASE}/user/password`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('token')}` },
                        body: JSON.stringify({ old_password: oldP, new_password: newP })
                    });
                    const data = await res.json().catch(() => ({}));
                    if (res.ok) {
                        if (typeof Toast !== 'undefined') Toast.success(data.message || '密码已修改'); else alert('密码已修改');
                        this.closeChangePassword();
                    } else {
                        if (typeof Toast !== 'undefined') Toast.error(data.error || '修改失败'); else alert(data.error || '修改失败');
                    }
                } catch (e) {
                    if (typeof Toast !== 'undefined') Toast.error('网络错误'); else alert('网络错误');
                }
            }
        };

        window.onload = loadProfile;
    </script>
</body>
</html>
