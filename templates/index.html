<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>诡境 - 灵异事件分享平台</title>
    <style>
        /* ============== 基础重置与变量 ============== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a25;
            --bg-hover: #222230;
            --text-primary: #e5e5e5;
            --text-secondary: #8b8b9e;
            --text-muted: #5a5a6e;
            --accent-purple: #7c3aed;
            --accent-purple-light: #a78bfa;
            --accent-purple-dark: #5b21b6;
            --accent-green: #10b981;
            --accent-green-dark: #059669;
            --accent-red: #ef4444;
            --accent-orange: #f59e0b;
            --border-color: #2d2d3d;
            --shadow-glow: 0 0 20px rgba(124, 58, 237, 0.3);
            --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.3);
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-full: 9999px;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* ============== 滚动条美化 ============== */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent-purple-dark);
            border-radius: var(--radius-full);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-purple);
        }

        /* ============== 鬼火动画背景 ============== */
        @keyframes ghostFire {
            0%, 100% {
                opacity: 0.3;
                transform: translateY(0) scale(1);
            }
            50% {
                opacity: 0.7;
                transform: translateY(-15px) scale(1.2);
            }
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-100vh) scale(1);
                opacity: 0;
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.5;
            }
            50% {
                opacity: 1;
            }
        }

        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }

        .ghost-fire-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .ghost-fire {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--accent-green);
            border-radius: 50%;
            box-shadow:
                0 0 10px var(--accent-green),
                0 0 20px var(--accent-green),
                0 0 40px var(--accent-green);
            animation: floatUp linear infinite;
        }

        /* ============== 顶部导航栏 ============== */
        .navbar {
            position: sticky;
            top: 0;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 0.75rem 1.5rem;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-purple);
            text-decoration: none;
            transition: transform 0.3s;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .logo-icon {
            font-size: 2rem;
            animation: ghostFire 3s ease-in-out infinite;
        }

        .logo-text {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-purple-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* 搜索框 */
        .search-container {
            flex: 1;
            max-width: 500px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 0.65rem 1rem 0.65rem 2.8rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-full);
            color: var(--text-primary);
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-purple);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            opacity: 0.6;
        }

        .search-clear {
            position: absolute;
            right: 0.8rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.1rem;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .search-input:not(:placeholder-shown) + .search-clear {
            opacity: 1;
        }

        /* 导航操作区 */
        .nav-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .btn {
            padding: 0.5rem 1.1rem;
            border-radius: var(--radius-full);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            white-space: nowrap;
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .btn-ghost:hover {
            color: var(--text-primary);
            border-color: var(--accent-purple);
            background: rgba(124, 58, 237, 0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-purple-dark));
            color: white;
            box-shadow: 0 2px 10px rgba(124, 58, 237, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--accent-green), var(--accent-green-dark));
            color: white;
        }

        .btn-success:hover {
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
        }

        .btn-danger {
            background: var(--accent-red);
            color: white;
        }

        .user-menu {
            position: relative;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-purple);
            cursor: pointer;
            transition: all 0.3s;
        }

        .user-avatar:hover {
            border-color: var(--accent-purple-light);
            box-shadow: 0 0 15px rgba(124, 58, 237, 0.5);
        }

        .user-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 0.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 0.5rem;
            min-width: 160px;
            display: none;
            z-index: 200;
            box-shadow: var(--shadow-card);
        }

        .user-dropdown.active {
            display: block;
        }

        .dropdown-item {
            padding: 0.6rem 1rem;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .dropdown-item:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .dropdown-divider {
            height: 1px;
            background: var(--border-color);
            margin: 0.5rem 0;
        }

        /* ============== 主容器布局 ============== */
        .main-container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 1.5rem;
            display: grid;
            grid-template-columns: 220px 1fr 260px;
            gap: 1.5rem;
            position: relative;
            z-index: 2;
        }

        @media (max-width: 1200px) {
            .main-container {
                grid-template-columns: 200px 1fr;
            }
            .right-sidebar {
                display: none;
            }
        }

        @media (max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
                padding: 1rem;
            }
            .left-sidebar {
                display: none;
            }
        }

        /* ============== 侧边栏 ============== */
        .sidebar {
            position: sticky;
            top: 80px;
            height: fit-content;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
        }

        .sidebar-card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 1rem;
            margin-bottom: 1rem;
            border: 1px solid var(--border-color);
            transition: border-color 0.3s;
        }

        .sidebar-card:hover {
            border-color: rgba(124, 58, 237, 0.3);
        }

        .sidebar-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        /* 导航菜单 */
        .nav-menu {
            list-style: none;
        }

        .nav-item {
            padding: 0.7rem 0.9rem;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 0.2rem;
        }

        .nav-item:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
            transform: translateX(3px);
        }

        .nav-item.active {
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.2), rgba(124, 58, 237, 0.1));
            color: var(--accent-purple-light);
            border-left: 3px solid var(--accent-purple);
            margin-left: -3px;
        }

        .nav-item-icon {
            font-size: 1.1rem;
        }

        /* 标签列表 */
        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .tag-item {
            padding: 0.35rem 0.7rem;
            background: var(--bg-secondary);
            border-radius: var(--radius-full);
            font-size: 0.8rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .tag-item:hover {
            background: var(--accent-purple);
            color: white;
            transform: scale(1.05);
        }

        .tag-item.active {
            background: var(--accent-purple);
            color: white;
        }

        /* 热门用户 */
        .hot-user {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.5rem;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background 0.2s;
        }

        .hot-user:hover {
            background: var(--bg-hover);
        }

        .hot-user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }

        .hot-user-info {
            flex: 1;
            min-width: 0;
        }

        .hot-user-name {
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .hot-user-stats {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* ============== 瀑布流布局 ============== */
        .masonry-grid {
            column-count: 2;
            column-gap: 1rem;
        }

        @media (min-width: 768px) {
            .masonry-grid {
                column-count: 3;
            }
        }

        @media (min-width: 1200px) {
            .masonry-grid {
                column-count: 4;
            }
        }

        .masonry-item {
            break-inside: avoid;
            margin-bottom: 1rem;
        }

        /* 帖子卡片 */
        .post-card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .post-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(124, 58, 237, 0.2);
            border-color: var(--accent-purple);
        }

        .post-image-wrapper {
            position: relative;
            overflow: hidden;
        }

        .post-image {
            width: 100%;
            display: block;
            transition: transform 0.4s ease;
        }

        .post-card:hover .post-image {
            transform: scale(1.03);
        }

        .post-image-placeholder {
            width: 100%;
            height: 120px;
            background: linear-gradient(
                90deg,
                var(--bg-secondary) 25%,
                var(--bg-hover) 50%,
                var(--bg-secondary) 75%
            );
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        .post-content {
            padding: 0.9rem;
        }

        .post-topics {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            margin-bottom: 0.5rem;
        }

        .topic-tag {
            padding: 0.2rem 0.5rem;
            background: rgba(124, 58, 237, 0.15);
            color: var(--accent-purple-light);
            border-radius: var(--radius-full);
            font-size: 0.7rem;
            font-weight: 500;
        }

        .post-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
        }

        .post-excerpt {
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.5;
            margin-bottom: 0.6rem;
        }

        .post-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .post-author {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .post-author-avatar {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            object-fit: cover;
        }

        .post-author-name {
            max-width: 80px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .post-stats {
            display: flex;
            gap: 0.7rem;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 0.2rem;
            transition: color 0.2s;
        }

        .stat-item.liked {
            color: var(--accent-red);
        }

        .stat-item.bookmarked {
            color: var(--accent-green);
        }

        .stat-icon {
            font-size: 0.9rem;
        }

        /* 置顶标识 */
        .pinned-badge {
            position: absolute;
            top: 0.5rem;
            left: 0.5rem;
            background: var(--accent-orange);
            color: white;
            padding: 0.2rem 0.5rem;
            border-radius: var(--radius-sm);
            font-size: 0.7rem;
            font-weight: 500;
        }

        /* ============== 模态框 ============== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            max-width: 480px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(-20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-header {
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-muted);
            cursor: pointer;
            line-height: 1;
            transition: color 0.2s;
            padding: 0.25rem;
        }

        .modal-close:hover {
            color: var(--text-primary);
        }

        .modal-body {
            padding: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.1rem;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-purple);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .form-textarea {
            min-height: 100px;
            resize: vertical;
            font-family: inherit;
        }

        .form-hint {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.3rem;
        }

        .form-error {
            font-size: 0.8rem;
            color: var(--accent-red);
            margin-top: 0.3rem;
        }

        /* ============== 帖子详情模态框 ============== */
        .post-detail-modal .modal {
            max-width: 800px;
        }

        .post-detail-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .post-detail-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .post-detail-meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .post-detail-author {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .post-detail-author-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-purple);
        }

        .post-detail-author-info {
            display: flex;
            flex-direction: column;
        }

        .post-detail-author-name {
            font-weight: 500;
            color: var(--text-primary);
        }

        .post-detail-time {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .post-detail-stats {
            display: flex;
            gap: 1rem;
            margin-left: auto;
        }

        .post-detail-content {
            padding: 1.5rem;
        }

        .post-detail-images {
            margin-bottom: 1rem;
        }

        .post-detail-images img {
            max-width: 100%;
            border-radius: var(--radius-md);
            margin-bottom: 0.5rem;
        }

        .post-detail-text {
            white-space: pre-wrap;
            line-height: 1.8;
            font-size: 0.95rem;
        }

        .post-detail-topics {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .post-detail-actions {
            display: flex;
            gap: 0.8rem;
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-secondary);
        }

        .action-btn {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.6rem 1.2rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-full);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.85rem;
        }

        .action-btn:hover {
            color: var(--text-primary);
            border-color: var(--accent-purple);
        }

        .action-btn.active.like {
            background: rgba(239, 68, 68, 0.15);
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

        .action-btn.active.bookmark {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        /* ============== 评论区域 ============== */
        .comments-section {
            padding: 1.5rem;
            max-height: 350px;
            overflow-y: auto;
        }

        .comments-header {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text-secondary);
        }

        .comment-item {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 1.2rem;
        }

        .comment-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .comment-body {
            flex: 1;
            min-width: 0;
        }

        .comment-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.2rem;
        }

        .comment-author {
            font-size: 0.85rem;
            font-weight: 500;
        }

        .comment-role {
            font-size: 0.7rem;
            padding: 0.1rem 0.4rem;
            background: var(--accent-purple);
            color: white;
            border-radius: var(--radius-sm);
        }

        .comment-role.admin {
            background: var(--accent-red);
        }

        .comment-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .comment-footer {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-top: 0.4rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .comment-action {
            cursor: pointer;
            transition: color 0.2s;
        }

        .comment-action:hover {
            color: var(--accent-purple);
        }

        .comment-input-wrapper {
            display: flex;
            gap: 0.5rem;
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border-color);
            background: var(--bg-secondary);
        }

        .comment-input {
            flex: 1;
            padding: 0.65rem 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-full);
            color: var(--text-primary);
            font-size: 0.85rem;
        }

        .comment-input:focus {
            outline: none;
            border-color: var(--accent-purple);
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .empty-text {
            font-size: 0.9rem;
        }

        /* ============== 加载状态 ============== */
        .loading-wrapper {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-purple);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 0.9rem;
        }

        /* 骨架屏 */
        .skeleton {
            background: linear-gradient(
                90deg,
                var(--bg-secondary) 25%,
                var(--bg-hover) 50%,
                var(--bg-secondary) 75%
            );
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: var(--radius-sm);
        }

        /* ============== Toast 提示 ============== */
        .toast-container {
            position: fixed;
            top: 80px;
            right: 20px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .toast {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 0.9rem 1.3rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            animation: toastSlideIn 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            max-width: 300px;
        }

        .toast.success {
            border-color: var(--accent-green);
        }

        .toast.success .toast-icon {
            color: var(--accent-green);
        }

        .toast.error {
            border-color: var(--accent-red);
        }

        .toast.error .toast-icon {
            color: var(--accent-red);
        }

        .toast-icon {
            font-size: 1.2rem;
        }

        .toast-message {
            font-size: 0.9rem;
        }

        @keyframes toastSlideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* ============== 响应式调整 ============== */
        @media (max-width: 600px) {
            .navbar {
                padding: 0.6rem 1rem;
            }

            .logo-text {
                display: none;
            }

            .search-container {
                max-width: none;
            }

            .btn {
                padding: 0.45rem 0.8rem;
                font-size: 0.8rem;
            }

            .masonry-grid {
                column-count: 2;
                column-gap: 0.75rem;
            }

            .post-content {
                padding: 0.7rem;
            }

            .post-title {
                font-size: 0.85rem;
            }

            .post-excerpt {
                font-size: 0.75rem;
                -webkit-line-clamp: 2;
            }

            .modal {
                margin: 0.5rem;
                max-height: 95vh;
            }

            .post-detail-modal .modal {
                max-width: 100%;
            }

            .post-detail-actions {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <!-- 鬼火背景容器 -->
    <div class="ghost-fire-container" id="ghostFireContainer"></div>

    <!-- 顶部导航栏 -->
    <nav class="navbar">
        <a href="/" class="logo">
            <span class="logo-icon">👻</span>
            <span class="logo-text">诡境</span>
        </a>

        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" id="searchInput" placeholder="搜索灵异事件、话题、用户..." />
            <button class="search-clear" id="searchClear">&times;</button>
        </div>

        <div class="nav-actions">
            <button class="btn btn-primary" id="createPostBtn">📝 投稿</button>

            <div id="authButtons">
                <button class="btn btn-ghost" id="loginBtn">🚪 入境</button>
                <button class="btn btn-primary" id="registerBtn">📜 签约</button>
            </div>

            <div class="user-menu" id="userMenu" style="display: none;">
                <img class="user-avatar" id="userAvatarBtn" src="" alt="用户头像" />
                <div class="user-dropdown" id="userDropdown">
                    <div class="dropdown-item" id="profileBtn">
                        <span>👤</span> 个人主页
                    </div>
                    <div class="dropdown-item" id="myPostsBtn">
                        <span>📝</span> 我的投稿
                    </div>
                    <div class="dropdown-item" id="bookmarksBtn">
                        <span>⭐</span> 诡异录
                    </div>
                    <div class="dropdown-divider"></div>
                    <div class="dropdown-item" id="settingsBtn">
                        <span>⚙️</span> 设置
                    </div>
                    <div class="dropdown-item" id="logoutBtn" style="color: var(--accent-red);">
                        <span>🚪</span> 离开诡境
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主容器 -->
    <div class="main-container">
        <!-- 左侧边栏 -->
        <aside class="sidebar left-sidebar">
            <div class="sidebar-card">
                <div class="sidebar-title">探索</div>
                <ul class="nav-menu">
                    <li class="nav-item active" data-sort="hot">
                        <span class="nav-item-icon">🔥</span> 热门
                    </li>
                    <li class="nav-item" data-sort="new">
                        <span class="nav-item-icon">✨</span> 最新
                    </li>
                    <li class="nav-item" data-sort="following">
                        <span class="nav-item-icon">👥</span> 关注
                    </li>
                    <li class="nav-item" data-view="bookmarks">
                        <span class="nav-item-icon">⭐</span> 诡异录
                    </li>
                </ul>
            </div>

            <div class="sidebar-card">
                <div class="sidebar-title">热门话题</div>
                <div class="tag-list" id="sidebarTopics"></div>
            </div>
        </aside>

        <!-- 主内容区 - 瀑布流 -->
        <main class="content-area">
            <div class="masonry-grid" id="postGrid"></div>

            <div class="loading-wrapper" id="loadingArea" style="display: none;">
                <div class="loading-spinner"></div>
                <div class="loading-text">正在召唤灵体...</div>
            </div>

            <div class="empty-state" id="emptyState" style="display: none;">
                <div class="empty-icon">👻</div>
                <div class="empty-text">这里空空如也，快来投稿你的灵异经历吧！</div>
            </div>
        </main>

        <!-- 右侧边栏 -->
        <aside class="sidebar right-sidebar">
            <div class="sidebar-card">
                <div class="sidebar-title">🔥 热门标签</div>
                <div class="tag-list" id="hotTags"></div>
            </div>

            <div class="sidebar-card">
                <div class="sidebar-title">👑 活跃信徒</div>
                <div id="activeUsers"></div>
            </div>
        </aside>
    </div>

    <!-- 登录模态框 -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">🚪 入境</h3>
                <button class="modal-close" data-close="loginModal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label">用户名 / 邮箱</label>
                        <input type="text" class="form-input" id="loginUsername" placeholder="请输入用户名或邮箱" required />
                    </div>
                    <div class="form-group">
                        <label class="form-label">密码</label>
                        <input type="password" class="form-input" id="loginPassword" placeholder="请输入密码" required />
                    </div>
                    <div class="form-error" id="loginError"></div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
                        入境
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- 注册模态框 -->
    <div class="modal-overlay" id="registerModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">📜 签约</h3>
                <button class="modal-close" data-close="registerModal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="registerForm">
                    <div class="form-group">
                        <label class="form-label">用户名 *</label>
                        <input type="text" class="form-input" id="regUsername" placeholder="至少3个字符" required minlength="3" maxlength="50" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">邮箱 *</label>
                        <input type="email" class="form-input" id="regEmail" placeholder="用于找回密码" required />
                    </div>
                    <div class="form-group">
                        <label class="form-label">密码 *</label>
                        <input type="password" class="form-input" id="regPassword" placeholder="至少6个字符" required minlength="6" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">昵称</label>
                        <input type="text" class="form-input" id="regNickname" placeholder="显示名称（可选）" maxlength="50" />
                    </div>
                    <div class="form-error" id="registerError"></div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
                        签约入驻
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- 发帖模态框 -->
    <div class="modal-overlay" id="createPostModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">📝 投稿灵异事件</h3>
                <button class="modal-close" data-close="createPostModal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="createPostForm">
                    <div class="form-group">
                        <label class="form-label">标题 *</label>
                        <input type="text" class="form-input" id="postTitle" placeholder="给事件起个名字" required maxlength="200" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">内容 *</label>
                        <textarea class="form-input form-textarea" id="postContent" placeholder="详细描述你经历的灵异事件..." required maxlength="10000"></textarea>
                        <div class="form-hint">支持换行，最多10000字</div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">图片链接</label>
                        <textarea class="form-input form-textarea" id="postImages" placeholder="每行一个图片链接，最多9张" style="min-height: 60px;"></textarea>
                        <div class="form-hint">支持 jpg/png/gif/webp 格式</div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">话题标签</label>
                        <input type="text" class="form-input" id="postTopics" placeholder="用逗号分隔，如：校园怪谈,真实经历" />
                        <div class="form-hint">最多5个话题</div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">分类标签</label>
                        <input type="text" class="form-input" id="postTags" placeholder="用逗号分隔，如：灵异,恐怖" />
                        <div class="form-hint">最多5个标签</div>
                    </div>
                    <div class="form-error" id="createPostError"></div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
                        发布投稿
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- 帖子详情模态框 -->
    <div class="modal-overlay post-detail-modal" id="postDetailModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">📖 灵异详情</h3>
                <button class="modal-close" data-close="postDetailModal">&times;</button>
            </div>
            <div id="postDetailBody"></div>
        </div>
    </div>

    <!-- Toast 容器 -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ============== 全局配置与状态 ==============
        const CONFIG = {
            API_BASE: '/api',
            PER_PAGE: 20,
            GHOST_FIRE_COUNT: 12
        };

        const state = {
            user: null,
            token: null,
            posts: [],
            currentPage: 1,
            currentSort: 'hot',
            currentTag: null,
            isLoading: false,
            hasMore: true,
            searchQuery: ''
        };

        // ============== 工具函数 ==============
        const Utils = {
            // HTML转义防XSS
            escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            },

            // 时间格式化
            formatTime(dateStr) {
                if (!dateStr) return '';
                const date = new Date(dateStr);
                const now = new Date();
                const diff = (now - date) / 1000;

                if (diff < 60) return '刚刚';
                if (diff < 3600) return Math.floor(diff / 60) + '分钟前';
                if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
                if (diff < 604800) return Math.floor(diff / 86400) + '天前';
                if (diff < 2592000) return Math.floor(diff / 604800) + '周前';

                return date.toLocaleDateString('zh-CN');
            },

            // 防抖
            debounce(fn, delay) {
                let timer = null;
                return function(...args) {
                    clearTimeout(timer);
                    timer = setTimeout(() => fn.apply(this, args), delay);
                };
            },

            // 检测图片URL是否有效
            isValidImageUrl(url) {
                if (!url || typeof url !== 'string') return false;
                return /^https?:\/\/.+\.(jpg|jpeg|png|gif|webp)$/i.test(url) ||
                       /^data:image\//.test(url);
            }
        };

        // ============== Toast 提示 ==============
        const Toast = {
            show(message, type = 'info') {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;

                const icon = type === 'success' ? '✓' : type === 'error' ? '✗' : 'ℹ';
                toast.innerHTML = `
                    <span class="toast-icon">${icon}</span>
                    <span class="toast-message">${Utils.escapeHtml(message)}</span>
                `;

                container.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            },

            success(message) {
                this.show(message, 'success');
            },

            error(message) {
                this.show(message, 'error');
            }
        };

        // ============== 模态框管理 ==============
        const Modal = {
            open(id) {
                const modal = document.getElementById(id);
                if (modal) {
                    modal.classList.add('active');
                    document.body.style.overflow = 'hidden';
                }
            },

            close(id) {
                const modal = document.getElementById(id);
                if (modal) {
                    modal.classList.remove('active');
                    document.body.style.overflow = '';
                }
            },

            closeAll() {
                document.querySelectorAll('.modal-overlay.active').forEach(modal => {
                    modal.classList.remove('active');
                });
                document.body.style.overflow = '';
            }
        };

        // ============== API 请求封装 ==============
        const API = {
            async request(endpoint, options = {}) {
                const url = CONFIG.API_BASE + endpoint;
                const headers = {
                    'Content-Type': 'application/json',
                    ...options.headers
                };

                if (state.token) {
                    headers['Authorization'] = `Bearer ${state.token}`;
                }

                try {
                    const response = await fetch(url, {
                        ...options,
                        headers
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error || '请求失败');
                    }

                    return data;
                } catch (error) {
                    console.error('API Error:', error);
                    throw error;
                }
            },

            // 认证相关
            async login(username, password) {
                return this.request('/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ username, password })
                });
            },

            async register(data) {
                return this.request('/auth/register', {
                    method: 'POST',
                    body: JSON.stringify(data)
                });
            },

            async getCurrentUser() {
                return this.request('/auth/me');
            },

            // 帖子相关
            async getPosts(params = {}) {
                const query = new URLSearchParams({
                    page: params.page || state.currentPage,
                    per_page: params.per_page || CONFIG.PER_PAGE,
                    sort: params.sort || state.currentSort,
                    ...(params.tag && { tag: params.tag }),
                    ...(params.q && { q: params.q })
                }).toString();

                return this.request(`/posts?${query}`);
            },

            async getPost(postId) {
                return this.request(`/posts/${postId}`);
            },

            async createPost(data) {
                return this.request('/posts', {
                    method: 'POST',
                    body: JSON.stringify(data)
                });
            },

            async toggleLike(postId) {
                return this.request(`/posts/${postId}/like`, { method: 'POST' });
            },

            async toggleBookmark(postId) {
                return this.request(`/posts/${postId}/bookmark`, { method: 'POST' });
            },

            async incrementView(postId) {
                return this.request(`/posts/${postId}/view`, { method: 'POST' });
            },

            // 评论相关
            async getComments(postId) {
                return this.request(`/posts/${postId}/comments`);
            },

            async createComment(postId, content) {
                return this.request(`/posts/${postId}/comments`, {
                    method: 'POST',
                    body: JSON.stringify({ content })
                });
            },

            // 标签相关
            async getTags() {
                return this.request('/tags');
            },

            // 搜索
            async search(query) {
                return this.request(`/search?q=${encodeURIComponent(query)}`);
            }
        };

        // ============== UI 渲染 ==============
        const UI = {
            // 创建鬼火效果
            createGhostFires() {
                const container = document.getElementById('ghostFireContainer');
                for (let i = 0; i < CONFIG.GHOST_FIRE_COUNT; i++) {
                    const fire = document.createElement('div');
                    fire.className = 'ghost-fire';
                    fire.style.cssText = `
                        left: ${Math.random() * 100}%;
                        animation-delay: ${Math.random() * 8}s;
                        animation-duration: ${6 + Math.random() * 6}s;
                    `;
                    container.appendChild(fire);
                }
            },

            // 更新认证状态UI
            updateAuthUI() {
                const authButtons = document.getElementById('authButtons');
                const userMenu = document.getElementById('userMenu');
                const userAvatarBtn = document.getElementById('userAvatarBtn');

                if (state.user) {
                    authButtons.style.display = 'none';
                    userMenu.style.display = 'flex';
                    userAvatarBtn.src = state.user.avatar || '/static/default-avatar.png';
                } else {
                    authButtons.style.display = 'flex';
                    userMenu.style.display = 'none';
                }
            },

            // 渲染帖子卡片
            renderPostCard(post) {
                const imageHtml = post.images && post.images.length > 0
                    ? `<img class="post-image" src="${Utils.escapeHtml(post.images[0])}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'post-image-placeholder\\'></div>'" />`
                    : '<div class="post-image-placeholder"></div>';

                const topicsHtml = post.topics && post.topics.length > 0
                    ? post.topics.slice(0, 3).map(t => `<span class="topic-tag">#${Utils.escapeHtml(t)}</span>`).join('')
                    : '';

                const pinnedBadge = post.is_pinned ? '<span class="pinned-badge">📌 置顶</span>' : '';
                const likeClass = post.is_liked ? 'liked' : '';
                const bookmarkClass = post.is_bookmarked ? 'bookmarked' : '';

                return `
                    <div class="masonry-item">
                        <article class="post-card" data-post-id="${post.id}">
                            <div class="post-image-wrapper">
                                ${imageHtml}
                                ${pinnedBadge}
                            </div>
                            <div class="post-content">
                                ${topicsHtml ? `<div class="post-topics">${topicsHtml}</div>` : ''}
                                <h3 class="post-title">${Utils.escapeHtml(post.title)}</h3>
                                <p class="post-excerpt">${Utils.escapeHtml(post.content.substring(0, 150))}</p>
                                <div class="post-meta">
                                    <div class="post-author">
                                        <img class="post-author-avatar"
                                             src="${post.author?.avatar || '/static/default-avatar.png'}"
                                             alt="" />
                                        <span class="post-author-name">${Utils.escapeHtml(post.author?.nickname || post.author?.username || '匿名')}</span>
                                    </div>
                                    <div class="post-stats">
                                        <span class="stat-item ${likeClass}">
                                            <span class="stat-icon">😰</span>${post.likes_count || 0}
                                        </span>
                                        <span class="stat-item">
                                            <span class="stat-icon">💬</span>${post.comments_count || 0}
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </article>
                    </div>
                `;
            },

            // 渲染帖子列表
            renderPosts(posts, append = false) {
                const grid = document.getElementById('postGrid');
                const emptyState = document.getElementById('emptyState');

                if (!append) {
                    grid.innerHTML = '';
                }

                if (posts.length === 0 && !append) {
                    emptyState.style.display = 'block';
                    return;
                }

                emptyState.style.display = 'none';
                grid.innerHTML += posts.map(post => this.renderPostCard(post)).join('');
            },

            // 渲染帖子详情
            renderPostDetail(post) {
                const body = document.getElementById('postDetailBody');
                const imagesHtml = post.images && post.images.length > 0
                    ? `<div class="post-detail-images">${post.images.map(img =>
                        `<img src="${Utils.escapeHtml(img)}" alt="" onerror="this.style.display='none'" />`
                    ).join('')}</div>`
                    : '';

                const topicsHtml = post.topics && post.topics.length > 0
                    ? post.topics.map(t => `<span class="topic-tag">#${Utils.escapeHtml(t)}</span>`).join('')
                    : '';

                const likeClass = post.is_liked ? 'active like' : '';
                const bookmarkClass = post.is_bookmarked ? 'active bookmark' : '';

                body.innerHTML = `
                    <div class="post-detail-header">
                        <h2 class="post-detail-title">${Utils.escapeHtml(post.title)}</h2>
                        <div class="post-detail-meta">
                            <div class="post-detail-author">
                                <img class="post-detail-author-avatar"
                                     src="${post.author?.avatar || '/static/default-avatar.png'}" alt="" />
                                <div class="post-detail-author-info">
                                    <span class="post-detail-author-name">${Utils.escapeHtml(post.author?.nickname || post.author?.username || '匿名')}</span>
                                    <span class="post-detail-time">${Utils.formatTime(post.created_at)}</span>
                                </div>
                            </div>
                            <div class="post-detail-stats">
                                <span>👁 ${post.view_count || 0}</span>
                                <span>😰 ${post.likes_count || 0}</span>
                                <span>💬 ${post.comments_count || 0}</span>
                            </div>
                        </div>
                    </div>
                    <div class="post-detail-content">
                        ${imagesHtml}
                        <p class="post-detail-text">${Utils.escapeHtml(post.content)}</p>
                        ${topicsHtml ? `<div class="post-detail-topics">${topicsHtml}</div>` : ''}
                    </div>
                    <div class="post-detail-actions">
                        <button class="action-btn ${likeClass}" data-action="like" data-post-id="${post.id}">
                            😰 恐惧 (${post.likes_count || 0})
                        </button>
                        <button class="action-btn ${bookmarkClass}" data-action="bookmark" data-post-id="${post.id}">
                            ⭐ 诡异录 (${post.bookmarks_count || 0})
                        </button>
                        <button class="action-btn" data-action="share" data-post-id="${post.id}">
                            📤 分享
                        </button>
                    </div>
                    <div class="comments-section" id="commentsSection">
                        <div class="comments-header">💬 评论 (${post.comments_count || 0})</div>
                        <div id="commentsList"></div>
                    </div>
                    <div class="comment-input-wrapper">
                        <input type="text" class="comment-input" id="commentInput" placeholder="写下你的看法..." />
                        <button class="btn btn-primary" data-action="comment" data-post-id="${post.id}">发送</button>
                    </div>
                `;

                // 加载评论
                this.loadComments(post.id);
            },

            // 渲染评论列表
            renderComments(comments) {
                const list = document.getElementById('commentsList');

                if (!comments || comments.length === 0) {
                    list.innerHTML = '<div class="empty-state" style="padding: 1rem;"><p class="empty-text">暂无评论，快来抢沙发~</p></div>';
                    return;
                }

                list.innerHTML = comments.map(comment => `
                    <div class="comment-item">
                        <img class="comment-avatar"
                             src="${comment.author?.avatar || '/static/default-avatar.png'}" alt="" />
                        <div class="comment-body">
                            <div class="comment-header">
                                <span class="comment-author">${Utils.escapeHtml(comment.author?.nickname || comment.author?.username || '匿名')}</span>
                                ${comment.author?.role === 'admin' ? '<span class="comment-role admin">管理员</span>' : ''}
                            </div>
                            <p class="comment-text">${Utils.escapeHtml(comment.content)}</p>
                            <div class="comment-footer">
                                <span>${Utils.formatTime(comment.created_at)}</span>
                                <span class="comment-action" data-action="reply" data-comment-id="${comment.id}">回复</span>
                            </div>
                        </div>
                    </div>
                `).join('');
            },

            // 加载评论
            async loadComments(postId) {
                try {
                    const data = await API.getComments(postId);
                    this.renderComments(data.comments || data.items || []);
                } catch (error) {
                    console.error('Load comments failed:', error);
                }
            },

            // 渲染标签
            renderTags(tags, containerId) {
                const container = document.getElementById(containerId);
                if (!container) return;

                container.innerHTML = tags.map(tag => `
                    <span class="tag-item" data-tag="${Utils.escapeHtml(tag.name)}">${Utils.escapeHtml(tag.name)}</span>
                `).join('');
            }
        };

        // ============== 应用初始化 ==============
        const App = {
            async init() {
                // 初始化鬼火效果
                UI.createGhostFires();

                // 检查登录状态
                await this.checkAuth();

                // 加载数据
                await Promise.all([
                    this.loadPosts(),
                    this.loadTags()
                ]);

                // 绑定事件
                this.bindEvents();

                // 初始化无限滚动
                this.initInfiniteScroll();
            },

            // 检查登录状态
            async checkAuth() {
                state.token = localStorage.getItem('token');
                if (!state.token) return;

                try {
                    const data = await API.getCurrentUser();
                    state.user = data.user;
                    UI.updateAuthUI();
                } catch (error) {
                    localStorage.removeItem('token');
                    state.token = null;
                }
            },

            // 加载帖子
            async loadPosts(append = false) {
                if (state.isLoading || (!append && !state.hasMore)) return;

                state.isLoading = true;
                document.getElementById('loadingArea').style.display = 'block';

                try {
                    const params = {
                        page: state.currentPage,
                        sort: state.currentSort
                    };

                    if (state.currentTag) {
                        params.tag = state.currentTag;
                    }

                    if (state.searchQuery) {
                        params.q = state.searchQuery;
                    }

                    let data;
                    if (state.searchQuery) {
                        data = await API.search(state.searchQuery);
                    } else {
                        data = await API.getPosts(params);
                    }

                    const posts = data.posts || data.items || [];

                    if (append) {
                        state.posts = [...state.posts, ...posts];
                    } else {
                        state.posts = posts;
                    }

                    UI.renderPosts(posts, append);

                    state.hasMore = posts.length === CONFIG.PER_PAGE;
                    state.currentPage++;
                } catch (error) {
                    Toast.error('加载失败，请稍后重试');
                    console.error('Load posts error:', error);
                } finally {
                    state.isLoading = false;
                    document.getElementById('loadingArea').style.display = 'none';
                }
            },

            // 加载标签
            async loadTags() {
                try {
                    const data = await API.getTags();
                    const tags = data.tags || data.items || [];
                    UI.renderTags(tags, 'hotTags');
                    UI.renderTags(tags, 'sidebarTopics');
                } catch (error) {
                    console.error('Load tags error:', error);
                }
            },

            // 绑定事件
            bindEvents() {
                // 模态框关闭按钮
                document.querySelectorAll('[data-close]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        Modal.close(btn.dataset.close);
                    });
                });

                // 点击模态框背景关闭
                document.querySelectorAll('.modal-overlay').forEach(overlay => {
                    overlay.addEventListener('click', (e) => {
                        if (e.target === overlay) {
                            Modal.closeAll();
                        }
                    });
                });

                // 登录
                document.getElementById('loginBtn').addEventListener('click', () => Modal.open('loginModal'));
                document.getElementById('loginForm').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const username = document.getElementById('loginUsername').value.trim();
                    const password = document.getElementById('loginPassword').value;
                    const errorEl = document.getElementById('loginError');

                    try {
                        const data = await API.login(username, password);
                        state.token = data.token;
                        state.user = data.user;
                        localStorage.setItem('token', data.token);
                        UI.updateAuthUI();
                        Modal.close('loginModal');
                        Toast.success('入境成功，欢迎来到诡境');
                        this.loadPosts();
                    } catch (error) {
                        errorEl.textContent = error.message;
                    }
                });

                // 注册
                document.getElementById('registerBtn').addEventListener('click', () => Modal.open('registerModal'));
                document.getElementById('registerForm').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const data = {
                        username: document.getElementById('regUsername').value.trim(),
                        email: document.getElementById('regEmail').value.trim(),
                        password: document.getElementById('regPassword').value,
                        nickname: document.getElementById('regNickname').value.trim()
                    };
                    const errorEl = document.getElementById('registerError');

                    try {
                        const result = await API.register(data);
                        state.token = result.token;
                        state.user = result.user;
                        localStorage.setItem('token', result.token);
                        UI.updateAuthUI();
                        Modal.close('registerModal');
                        Toast.success('签约成功，欢迎加入诡境');
                    } catch (error) {
                        errorEl.textContent = error.message;
                    }
                });

                // 发帖
                document.getElementById('createPostBtn').addEventListener('click', () => {
                    if (!state.user) {
                        Toast.error('请先登录');
                        Modal.open('loginModal');
                        return;
                    }
                    Modal.open('createPostModal');
                });

                document.getElementById('createPostForm').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const imagesText = document.getElementById('postImages').value.trim();
                    const images = imagesText.split('\n').filter(s => s.trim() && Utils.isValidImageUrl(s.trim())).slice(0, 9);

                    const topicsText = document.getElementById('postTopics').value.trim();
                    const topics = topicsText.split(',').map(s => s.trim()).filter(s => s).slice(0, 5);

                    const tagsText = document.getElementById('postTags').value.trim();
                    const tags = tagsText.split(',').map(s => s.trim()).filter(s => s).slice(0, 5);

                    const data = {
                        title: document.getElementById('postTitle').value.trim(),
                        content: document.getElementById('postContent').value.trim(),
                        images,
                        topics,
                        tags
                    };

                    const errorEl = document.getElementById('createPostError');

                    try {
                        await API.createPost(data);
                        Modal.close('createPostModal');
                        Toast.success('投稿成功！');
                        state.currentPage = 1;
                        state.hasMore = true;
                        this.loadPosts();

                        // 重置表单
                        document.getElementById('createPostForm').reset();
                    } catch (error) {
                        errorEl.textContent = error.message;
                    }
                });

                // 用户菜单
                const userAvatarBtn = document.getElementById('userAvatarBtn');
                const userDropdown = document.getElementById('userDropdown');

                userAvatarBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    userDropdown.classList.toggle('active');
                });

                document.addEventListener('click', () => {
                    userDropdown.classList.remove('active');
                });

                // 退出登录
                document.getElementById('logoutBtn').addEventListener('click', () => {
                    localStorage.removeItem('token');
                    state.token = null;
                    state.user = null;
                    UI.updateAuthUI();
                    Toast.success('已离开诡境');
                    state.currentPage = 1;
                    this.loadPosts();
                });

                // 导航菜单
                document.querySelectorAll('.nav-item').forEach(item => {
                    item.addEventListener('click', function() {
                        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                        this.classList.add('active');

                        const sort = this.dataset.sort;
                        const view = this.dataset.view;

                        if (sort) {
                            state.currentSort = sort;
                            state.currentTag = null;
                            state.searchQuery = '';
                            document.getElementById('searchInput').value = '';
                        } else if (view === 'bookmarks') {
                            state.currentSort = 'bookmarks';
                        }

                        state.currentPage = 1;
                        state.hasMore = true;
                        App.loadPosts();
                    });
                });

                // 标签点击
                document.addEventListener('click', (e) => {
                    const tagItem = e.target.closest('.tag-item');
                    if (tagItem && tagItem.dataset.tag) {
                        state.currentTag = tagItem.dataset.tag;
                        state.currentPage = 1;
                        state.hasMore = true;

                        document.querySelectorAll('.tag-item').forEach(i => i.classList.remove('active'));
                        document.querySelectorAll(`.tag-item[data-tag="${tagItem.dataset.tag}"]`).forEach(i => i.classList.add('active'));

                        App.loadPosts();
                    }
                });

                // 搜索
                const searchInput = document.getElementById('searchInput');
                searchInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        const query = searchInput.value.trim();
                        if (query) {
                            state.searchQuery = query;
                            state.currentPage = 1;
                            state.hasMore = true;
                            App.loadPosts();
                        }
                    }
                });

                document.getElementById('searchClear').addEventListener('click', () => {
                    searchInput.value = '';
                    state.searchQuery = '';
                    state.currentPage = 1;
                    state.hasMore = true;
                    App.loadPosts();
                });

                // 帖子点击
                document.getElementById('postGrid').addEventListener('click', async (e) => {
                    const card = e.target.closest('.post-card');
                    if (!card) return;

                    const postId = parseInt(card.dataset.postId);
                    await this.openPostDetail(postId);
                });

                // 帖子详情操作
                document.getElementById('postDetailBody').addEventListener('click', async (e) => {
                    const btn = e.target.closest('[data-action]');
                    if (!btn) return;

                    const action = btn.dataset.action;
                    const postId = parseInt(btn.dataset.postId);

                    switch (action) {
                        case 'like':
                            await this.toggleLike(postId);
                            break;
                        case 'bookmark':
                            await this.toggleBookmark(postId);
                            break;
                        case 'share':
                            this.sharePost(postId);
                            break;
                        case 'comment':
                            await this.submitComment(postId);
                            break;
                    }
                });
            },

            // 打开帖子详情
            async openPostDetail(postId) {
                Modal.open('postDetailModal');
                document.getElementById('postDetailBody').innerHTML = '<div class="loading-wrapper"><div class="loading-spinner"></div></div>';

                try {
                    const post = await API.getPost(postId);
                    UI.renderPostDetail(post);

                    // 增加浏览量（异步执行，不等待）
                    API.incrementView(postId).catch(() => {});
                } catch (error) {
                    document.getElementById('postDetailBody').innerHTML = '<div class="empty-state"><p class="empty-text">加载失败</p></div>';
                }
            },

            // 点赞
            async toggleLike(postId) {
                if (!state.user) {
                    Toast.error('请先登录');
                    return;
                }

                try {
                    const data = await API.toggleLike(postId);
                    Toast.success(data.liked ? '已标记恐惧' : '取消恐惧');
                    await this.openPostDetail(postId);
                } catch (error) {
                    Toast.error('操作失败');
                }
            },

            // 收藏
            async toggleBookmark(postId) {
                if (!state.user) {
                    Toast.error('请先登录');
                    return;
                }

                try {
                    const data = await API.toggleBookmark(postId);
                    Toast.success(data.bookmarked ? '已加入诡异录' : '已从诡异录移除');
                    await this.openPostDetail(postId);
                } catch (error) {
                    Toast.error('操作失败');
                }
            },

            // 提交评论
            async submitComment(postId) {
                if (!state.user) {
                    Toast.error('请先登录');
                    return;
                }

                const input = document.getElementById('commentInput');
                const content = input.value.trim();

                if (!content) {
                    Toast.error('请输入评论内容');
                    return;
                }

                try {
                    await API.createComment(postId, content);
                    input.value = '';
                    Toast.success('评论成功');
                    UI.loadComments(postId);
                } catch (error) {
                    Toast.error('评论失败');
                }
            },

            // 分享
            sharePost(postId) {
                const url = `${window.location.origin}/post/${postId}`;
                navigator.clipboard.writeText(url).then(() => {
                    Toast.success('链接已复制');
                }).catch(() => {
                    Toast.error('复制失败');
                });
            },

            // 无限滚动
            initInfiniteScroll() {
                const handleScroll = Utils.debounce(() => {
                    const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                    const windowHeight = window.innerHeight;
                    const docHeight = document.documentElement.scrollHeight;

                    if (scrollTop + windowHeight >= docHeight - 500) {
                        if (state.hasMore && !state.isLoading) {
                            this.loadPosts(true);
                        }
                    }
                }, 100);

                window.addEventListener('scroll', handleScroll);
            }
        };

        // 启动应用
        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
