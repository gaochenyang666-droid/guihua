<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>诡境 - 灵异事件分享平台 (Web2)</title>
    <!-- 引入 FontAwesome 和 Web3.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
    <style>
        /* ============== 基础重置与变量 ============== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0a0a0f; --bg-secondary: #12121a; --bg-card: #1a1a25; --bg-hover: #222230;
            --text-primary: #e5e5e5; --text-secondary: #8b8b9e; --text-muted: #5a5a6e;
            --accent-purple: #7c3aed; --accent-purple-light: #a78bfa; --accent-purple-dark: #5b21b6;
            --accent-green: #10b981; --accent-red: #ef4444; --accent-orange: #f59e0b;
            --border-color: #2d2d3d;
            --radius-sm: 6px; --radius-md: 12px; --radius-lg: 16px; --radius-full: 9999px;
            --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; line-height: 1.6;
        }

        /* ============== 滚动条 ============== */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--accent-purple-dark); border-radius: var(--radius-full); }

        /* ============== 鬼火动画 ============== */
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-100vh) scale(1); opacity: 0; }
        }
        .ghost-fire-container { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .ghost-fire {
            position: absolute; width: 4px; height: 4px; background: var(--accent-green); border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-green), 0 0 20px var(--accent-green);
            animation: floatUp linear infinite;
        }

        /* ============== 导航栏 ============== */
        .navbar {
            position: sticky; top: 0; background: rgba(10, 10, 15, 0.95); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color); padding: 0.75rem 1.5rem; z-index: 100;
            display: flex; align-items: center; justify-content: space-between; gap: 1rem;
        }
        .logo { display: flex; align-items: center; gap: 0.5rem; font-size: 1.5rem; font-weight: 700; color: var(--accent-purple); text-decoration: none; }
        
        /* 搜索框 */
        .search-container { flex: 1; max-width: 500px; position: relative; }
        .search-input {
            width: 100%; padding: 0.65rem 1rem 0.65rem 2.8rem; background: var(--bg-secondary);
            border: 1px solid var(--border-color); border-radius: var(--radius-full); color: var(--text-primary);
        }
        .search-icon { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); opacity: 0.6; }

        /* 按钮与菜单 */
        .nav-actions { display: flex; align-items: center; gap: 0.75rem; }
        .btn {
            padding: 0.5rem 1.1rem; border-radius: var(--radius-full); font-size: 0.85rem; font-weight: 500;
            cursor: pointer; transition: all 0.3s; border: none; display: inline-flex; align-items: center; gap: 0.35rem;
            color: white; text-decoration: none;
        }
        .btn-ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border-color); }
        .btn-ghost:hover { border-color: var(--accent-purple); color: var(--text-primary); }
        .btn-primary { background: var(--accent-purple); }
        .btn-primary:hover { background: var(--accent-purple-dark); }
        
        .user-avatar { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--accent-purple); cursor: pointer; }
        
        /* ============== 布局 ============== */
        .main-container {
            max-width: 1200px; margin: 0 auto; padding: 1.5rem; display: grid; grid-template-columns: 200px 1fr; gap: 1.5rem; position: relative; z-index: 2;
        }
        @media (max-width: 900px) { .main-container { grid-template-columns: 1fr; } .sidebar { display: none; } }

        /* 侧边栏 */
        .sidebar-card { background: var(--bg-card); border-radius: var(--radius-md); padding: 1rem; margin-bottom: 1rem; border: 1px solid var(--border-color); }
        .nav-item { padding: 0.7rem; cursor: pointer; color: var(--text-secondary); display: flex; gap: 0.6rem; border-radius: var(--radius-sm); }
        .nav-item:hover, .nav-item.active { background: var(--bg-hover); color: var(--text-primary); }
        .nav-item.active { color: var(--accent-purple-light); }

        /* 瀑布流 */
        .masonry-grid { column-count: 2; column-gap: 1.5rem; }
        @media (max-width: 600px) { .masonry-grid { column-count: 1; } }
        
        .masonry-item { break-inside: avoid; margin-bottom: 1.5rem; }
        .post-card {
            background: var(--bg-card); border-radius: 16px; overflow: hidden; border: 1px solid var(--border-color);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; position: relative; display: flex; flex-direction: column;
        }
        .post-card:hover { transform: translateY(-4px); box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5); border-color: var(--accent-purple); }
        
        .post-image { width: 100%; display: block; object-fit: cover; aspect-ratio: 3/4; background: var(--bg-secondary); }
        .post-content { padding: 1rem; flex: 1; display: flex; flex-direction: column; }
        .post-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.5rem; line-height: 1.4; color: var(--text-primary); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .post-meta { display: flex; align-items: center; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); margin-top: auto; }
        .author-info { display: flex; align-items: center; gap: 0.5rem; }
        .author-avatar { width: 20px; height: 20px; border-radius: 50%; background: #333; }

        /* ============== 模态框 ============== */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85);
            display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(4px);
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--bg-card); border-radius: var(--radius-lg); width: 90%; max-width: 500px;
            max-height: 90vh; overflow-y: auto; border: 1px solid var(--border-color); padding: 1.5rem;
        }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 1rem; align-items: center; }
        .modal-close { background: none; border: none; font-size: 1.5rem; color: var(--text-muted); cursor: pointer; }
        
        .form-group { margin-bottom: 1rem; }
        .form-label { display: block; margin-bottom: 0.4rem; font-size: 0.85rem; color: var(--text-secondary); }
        .form-input {
            width: 100%; padding: 0.75rem; background: var(--bg-secondary); border: 1px solid var(--border-color);
            border-radius: var(--radius-sm); color: var(--text-primary);
        }
        
        /* 详情页样式 */
        .post-detail-modal .modal { max-width: 800px; }
        .post-detail-content { padding: 1rem 0; font-size: 1rem; line-height: 1.8; }
        .post-detail-images img { max-width: 100%; border-radius: var(--radius-md); margin-bottom: 0.5rem; }
        
        /* 评论区 */
        .comments-section { margin-top: 1.5rem; border-top: 1px solid var(--border-color); padding-top: 1rem; }
        .comment-item { margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid var(--bg-secondary); }
        .comment-header { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.3rem; }
        
        /* Toast */
        .toast-container { position: fixed; top: 80px; right: 20px; z-index: 2000; }
        .toast { background: var(--bg-card); border: 1px solid var(--border-color); padding: 0.8rem 1.2rem; border-radius: var(--radius-md); margin-bottom: 0.5rem; color: white; }
        .toast.success { border-color: var(--accent-green); color: var(--accent-green); }
        .toast.error { border-color: var(--accent-red); color: var(--accent-red); }
        
        .auth-form { display: block; } /* Web2 only, no tabs needed */
    </style>
</head>
<body>
    <div class="ghost-fire-container" id="ghostFireContainer"></div>

    <nav class="navbar">
        <a href="/" class="logo"><span>👻</span> 诡境 (Web2)</a>
        
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" id="searchInput" placeholder="搜索灵异事件..." />
        </div>

        <div class="nav-actions">
            <!-- 创作者入口 -->
            <button class="btn btn-ghost" style="color: var(--accent-green); border-color: var(--accent-green);" onclick="Auth.checkAndGoStudio()">🧙‍♂️ 创作者入口 (Web3)</button>

            <div id="authButtons">
                <button class="btn btn-primary" onclick="Modal.open('loginModal')">登录 / 注册</button>
            </div>

            <div class="user-menu" id="userMenu" style="display: none; align-items: center; gap: 0.5rem;">
                <span id="userDisplayName" style="font-size: 0.9rem;"></span>
                <img class="user-avatar" id="userAvatarBtn" src="/static/default-avatar.png" />
                <button class="btn btn-ghost" id="logoutBtn" style="padding: 0.3rem 0.6rem; font-size: 0.8rem;">退出</button>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <aside class="sidebar">
            <div class="sidebar-card">
                <div class="nav-item active" data-sort="hot" onclick="UI.handleNav(this, 'hot')">🔥 热门</div>
                <div class="nav-item" data-sort="new" onclick="UI.handleNav(this, 'new')">✨ 最新</div>
                <div class="nav-item" data-sort="bookmarks" onclick="UI.handleNav(this, 'bookmarks')">⭐ 收藏</div>
            </div>
            <div class="sidebar-card" style="font-size: 0.85rem; color: var(--text-secondary);">
                <p>👻 <b>Web3 内容映射</b>：所有内容均来自链上或 Web3 创作者。</p>
                <p style="margin-top:0.5rem;">💬 <b>Web2 互动</b>：登录后可评论、点赞、收藏。</p>
            </div>
        </aside>

        <main>
            <div class="masonry-grid" id="postGrid"></div>
            <div id="loadingArea" style="text-align: center; padding: 2rem; color: var(--text-muted);">正在召唤灵体...</div>
        </main>
    </div>

    <!-- 登录/注册 模态框 (仅 Web2) -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal">
            <div class="modal-header">
                <h3>🚪 入境方式 (Web2)</h3>
                <button class="modal-close" onclick="Modal.close('loginModal')">&times;</button>
            </div>
            
            <div id="authForms">
                <!-- Login Form -->
                <div id="loginFormContainer">
                    <form id="loginForm">
                        <div class="form-group">
                            <label class="form-label">用户名</label>
                            <input type="text" class="form-input" id="loginUsername" required />
                        </div>
                        <div class="form-group">
                            <label class="form-label">密码</label>
                            <input type="password" class="form-input" id="loginPassword" required />
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%;">登录</button>
                        
                        <div style="margin: 1.5rem 0; border-top: 1px solid var(--border-color); position: relative; text-align: center;">
                            <span style="background: var(--bg-card); padding: 0 0.5rem; color: var(--text-muted); position: relative; top: -0.8rem; font-size: 0.8rem;">或</span>
                        </div>
                        
                        <button type="button" class="btn btn-ghost" style="width: 100%; border-color: var(--accent-orange); color: var(--accent-orange);" onclick="Auth.loginWeb3()">
                            <i class="fas fa-wallet"></i> 钱包连接 (Web3)
                        </button>

                        <div style="text-align: center; margin-top: 1rem; font-size: 0.85rem;">
                            <a href="#" onclick="Auth.toggleForm()" style="color: var(--accent-purple);">没有账号？点击注册</a>
                        </div>
                    </form>
                </div>

                <!-- Register Form -->
                <div id="registerFormContainer" style="display: none;">
                    <div class="form-group">
                        <label class="form-label">用户名</label>
                        <input type="text" class="form-input" id="regUsername" required />
                    </div>
                    <div class="form-group">
                        <label class="form-label">密码</label>
                        <input type="password" class="form-input" id="regPassword" required />
                    </div>
                    <button class="btn btn-primary" style="width: 100%;" onclick="Auth.register()">立即签约</button>
                    <div style="text-align: center; margin-top: 1rem; font-size: 0.85rem;">
                        <a href="#" onclick="Auth.toggleForm()" style="color: var(--text-secondary);">返回登录</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 详情模态框 -->
    <div class="modal-overlay post-detail-modal" id="postDetailModal">
        <div class="modal">
            <div class="modal-header">
                <h3>📖 档案</h3>
                <button class="modal-close" onclick="Modal.close('postDetailModal')">&times;</button>
            </div>
            <div id="postDetailBody"></div>
        </div>
    </div>
    
    <div class="toast-container" id="toastContainer"></div>

    <script>
        const API_BASE = window.location.origin + '/api';
        let currentUser = null;

        const Auth = {
            async init() {
                const token = localStorage.getItem('token');
                if (token) await this.fetchMe();
                UI.updateAuth();
            },

            async fetchMe() {
                try {
                    const res = await fetch(`${API_BASE}/user/me`, {
                        headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                    });
                    if (res.ok) currentUser = await res.json();
                    else this.logout();
                } catch(e) { console.error(e); }
            },

            toggleForm() {
                const login = document.getElementById('loginFormContainer');
                const reg = document.getElementById('registerFormContainer');
                if (login.style.display === 'none') {
                    login.style.display = 'block'; reg.style.display = 'none';
                } else {
                    login.style.display = 'none'; reg.style.display = 'block';
                }
            },

            async loginWeb3() {
                if (window.BinanceChain) {
                    window.web3 = new Web3(window.BinanceChain);
                } else if (window.ethereum) {
                    window.web3 = new Web3(window.ethereum);
                } else {
                    return Toast.error('请安装 MetaMask, Binance Wallet 或其他 Web3 钱包');
                }
                
                try {
                    let address;
                    let accounts;
                    
                    try {
                        accounts = await window.web3.eth.requestAccounts();
                    } catch (e) {
                         // Fallback logic for Binance Chain or older providers
                         if (window.BinanceChain) {
                             accounts = await window.BinanceChain.request({ method: 'eth_requestAccounts' });
                         } else if (window.ethereum) {
                             accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                         } else {
                             return Toast.error('无法连接钱包');
                         }
                    }
                    
                    if (!accounts || accounts.length === 0) return Toast.error('未检测到账户');
                    address = accounts[0];
                    
                    // 1. Get Nonce
                    const resNonce = await fetch(`${API_BASE}/auth/nonce?address=${address}`);
                    const { nonce } = await resNonce.json();
                    
                    // 2. Sign Message
                    const message = `Sign this message to login: ${nonce}`;
                    let signature;
                    
                    try {
                        // Use personal_sign
                        // Binance Wallet might need specific handling if web3 wrapper fails
                        if (window.BinanceChain) {
                             const res = await window.BinanceChain.request({
                                method: 'personal_sign',
                                params: [message, address] 
                             });
                             // Binance Chain might return object with result or just string
                             signature = (typeof res === 'object' && res.result) ? res.result : res;
                        } else {
                             signature = await window.web3.eth.personal.sign(message, address, '');
                        }
                    } catch (err) {
                        console.error("Sign error:", err);
                        // Try fallback parameter format for some wallets
                        try {
                             signature = await window.web3.eth.personal.sign(message, address);
                        } catch (e2) {
                             return Toast.error('签名被拒绝');
                        }
                    }
                    
                    // 3. Verify
                    const resVerify = await fetch(`${API_BASE}/auth/verify`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ address, signature, message })
                    });
                    
                    const data = await resVerify.json();
                    if (resVerify.ok) this.success(data);
                    else Toast.error(data.error);
                } catch(e) { Toast.error('登录失败: ' + e.message); }
            },

            async loginWeb2(username, password) {
                const res = await fetch(`${API_BASE}/auth/web2/login`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok) this.success(data);
                else Toast.error(data.error);
            },

            async register() {
                const username = document.getElementById('regUsername').value;
                const password = document.getElementById('regPassword').value;
                const res = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok) this.success(data);
                else Toast.error(data.error);
            },

            success(data) {
                localStorage.setItem('token', data.token);
                currentUser = data.user;
                UI.updateAuth();
                Modal.close('loginModal');
                Toast.success('认证成功');
            },

            logout() {
                localStorage.removeItem('token');
                currentUser = null;
                UI.updateAuth();
                Toast.info('已退出');
            },

            checkAndGoStudio() {
                if(currentUser) window.location.href = '/studio';
                else {
                    Toast.info('请先登录');
                    Modal.open('loginModal');
                }
            }
        };

        const Post = {
            async load(params={}) {
                try {
                    const q = new URLSearchParams(params).toString();
                    const headers = {};
                    const token = localStorage.getItem('token');
                    if (token) headers['Authorization'] = `Bearer ${token}`;

                    const res = await fetch(`${API_BASE}/posts?${q}`, { headers });
                    if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                    
                    const data = await res.json();
                    if (data.posts) {
                        UI.renderPosts(data.posts);
                    } else {
                        throw new Error('Invalid data format');
                    }
                } catch (e) {
                    console.error("Failed to load posts:", e);
                    document.getElementById('loadingArea').innerHTML = 
                        `<div style="color:var(--accent-red)">加载失败: ${e.message}<br><button class="btn btn-ghost" onclick="Post.load()">重试</button></div>`;
                }
            },
            
            async repost(id) {
                if (!currentUser) return Modal.open('loginModal');
                const content = prompt("转发附言:");
                if (content === null) return;

                const res = await fetch(`${API_BASE}/posts/${id}/repost`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify({ content })
                });
                if(res.ok) { Toast.success('转发成功'); this.load(); }
                else Toast.error((await res.json()).error);
            }
        };

        const UI = {
            updateAuth() {
                const authBtns = document.getElementById('authButtons');
                const userMenu = document.getElementById('userMenu');
                
                if (currentUser) {
                    authBtns.style.display = 'none';
                    userMenu.style.display = 'flex';
                    document.getElementById('userDisplayName').textContent = currentUser.nickname;
                    if(currentUser.avatar) {
                        const avatarEl = document.getElementById('userAvatarBtn');
                        if (currentUser.avatar.length <= 5) {
                            // Emoji avatar
                            avatarEl.style.display = 'none'; // hide img
                            // insert div if not exists
                            let emojiDiv = document.getElementById('userAvatarEmoji');
                            if(!emojiDiv) {
                                emojiDiv = document.createElement('div');
                                emojiDiv.id = 'userAvatarEmoji';
                                emojiDiv.className = 'user-avatar';
                                emojiDiv.style.display = 'flex';
                                emojiDiv.style.alignItems = 'center';
                                emojiDiv.style.justifyContent = 'center';
                                emojiDiv.style.background = 'var(--bg-secondary)';
                                emojiDiv.style.fontSize = '1.2rem';
                                avatarEl.parentNode.insertBefore(emojiDiv, avatarEl);
                            }
                            emojiDiv.textContent = currentUser.avatar;
                        } else {
                            // Image avatar
                            avatarEl.src = currentUser.avatar;
                            avatarEl.style.display = 'block';
                            const emojiDiv = document.getElementById('userAvatarEmoji');
                            if(emojiDiv) emojiDiv.remove();
                        }
                    }
                } else {
                    authBtns.style.display = 'flex';
                    userMenu.style.display = 'none';
                }
            },

            renderPosts(posts) {
                const grid = document.getElementById('postGrid');
                grid.innerHTML = posts.map(p => {
                    const imgUrl = p.cover_image || (p.images && p.images.length ? p.images[0] : null);
                    const img = imgUrl ? `<img src="${imgUrl}" class="post-image" loading="lazy">` : '';
                    
                    let content = p.content;
                    // ... (repost logic kept same)

                    return `
                    <div class="masonry-item">
                        <div class="post-card" onclick="Modal.openDetail(${p.id})">
                            ${img}
                            <div class="post-content">
                                <div class="post-title">${p.title}</div>
                                <div class="post-meta">
                                    <div class="author-info">
                                        ${UI.renderAvatar(p.author)}
                                        <span>${p.author.nickname}</span>
                                    </div>
                                    <div style="display:flex; gap:0.5rem; align-items:center;">
                                        <span><i class="fas fa-heart"></i> ${p.likes_count}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>`;
                }).join('');
                document.getElementById('loadingArea').style.display = 'none';
            },

            renderAvatar(user) {
                if (!user.avatar || user.avatar.length > 5) {
                    return `<img src="${user.avatar || '/static/default-avatar.png'}" class="author-avatar" onerror="this.src='/static/default-avatar.png'">`;
                }
                return `<div class="author-avatar" style="display:flex;align-items:center;justify-content:center;font-size:1.2rem;background:var(--bg-secondary);">${user.avatar}</div>`;
            },
            
            handleNav(el, sort) {
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                el.classList.add('active');
                Post.load({sort});
            }
        };

        const Modal = {
            open(id) { document.getElementById(id).classList.add('active'); },
            close(id) { document.getElementById(id).classList.remove('active'); },
            
            async openDetail(id) {
                this.open('postDetailModal');
                const body = document.getElementById('postDetailBody');
                body.innerHTML = '加载中...';
                
                const res = await fetch(`${API_BASE}/posts/${id}`);
                const p = await res.json();
                
                let contentHtml = p.content;
                let repostHtml = '';
                if (p.original_post_id && p.original_post) {
                    contentHtml = p.repost_comment || '';
                    repostHtml = `
                        <div style="margin:1rem 0; padding:1rem; border:1px solid var(--border-color); border-radius:8px; background:var(--bg-secondary);">
                            <div style="font-weight:600; margin-bottom:0.5rem;">${p.original_post.title}</div>
                            <div style="font-size:0.9rem; color:var(--text-secondary);">${p.original_post.content}</div>
                        </div>
                    `;
                }

                const commentsHtml = p.comments.map(c => `
                    <div class="comment-item">
                        <div class="comment-header"><span>${c.author.nickname}</span><span>${new Date(c.created_at).toLocaleDateString()}</span></div>
                        <div>${c.content}</div>
                    </div>
                `).join('');

                let adminControls = '';
                if (currentUser && currentUser.is_admin) {
                    adminControls = `
                        <div style="margin-top:1rem; padding-top:1rem; border-top:1px dashed var(--accent-red); color:var(--accent-red);">
                            <div style="margin-bottom:0.5rem; font-size:0.8rem; font-weight:bold;">👮 管理员操作</div>
                            <div style="display:flex; gap:0.5rem;">
                                <button class="btn btn-ghost" onclick="Interact.adminDelete(${p.id})" style="border-color:var(--accent-red); color:var(--accent-red);">删除帖子</button>
                                <button class="btn btn-ghost" onclick="Interact.adminToggleHide(${p.id})">${p.is_hidden ? '取消隐藏' : '隐藏帖子'}</button>
                                <button class="btn btn-ghost" onclick="Interact.adminToggleComments(${p.id})">${p.allow_comments ? '关闭评论' : '开启评论'}</button>
                            </div>
                        </div>
                    `;
                }

                body.innerHTML = `
                    <h2 style="margin-bottom:0.5rem;">${p.title}</h2>
                    <div style="font-size:0.85rem; color:var(--text-muted); margin-bottom:1rem;">
                        发布者: ${p.author.nickname} | 浏览: ${p.view_count}
                    </div>
                    <div class="post-detail-content">
                        ${contentHtml}
                        ${repostHtml}
                    </div>
                    
                    <div style="font-size:0.8rem; color:var(--text-secondary); margin-top:1rem;">
                        ⛓ TX: <a href="https://testnet.bscscan.com/tx/${p.tx_hash}" target="_blank" style="color:var(--accent-purple);">${p.tx_hash ? p.tx_hash.substring(0,10)+'...'+p.tx_hash.substring(56) : 'N/A'}</a>
                        ${p.ipfs_cid ? `<span style="margin-left:10px;">💾 IPFS: <a href="https://ipfs.io/ipfs/${p.ipfs_cid}" target="_blank" style="color:var(--accent-green);">永存档案</a></span>` : ''}
                    </div>
                    
                    <div style="display:flex; gap:1rem; margin:1rem 0; border-top:1px solid var(--border-color); padding-top:1rem;">
                        <button class="btn btn-ghost" onclick="Interact.like(${p.id})">😰 恐惧 (${p.likes_count})</button>
                        <button class="btn btn-ghost" onclick="Interact.bookmark(${p.id})">⭐ 收藏 (${p.is_bookmarked ? '已收' : ''})</button>
                        <button class="btn btn-ghost" onclick="Post.repost(${p.id})">🔄 转发</button>
                    </div>

                    ${adminControls}

                    <div class="comments-section">
                        <h4>评论</h4>
                        <div style="margin-bottom:1rem;">${commentsHtml}</div>
                        <div style="display:flex; gap:0.5rem;">
                            <input type="text" id="commentInput" class="form-input" placeholder="${p.allow_comments ? '发表评论...' : '评论区已关闭'}" ${!p.allow_comments && (!currentUser || !currentUser.is_admin) ? 'disabled' : ''}>
                            <button class="btn btn-primary" onclick="Interact.comment(${p.id})" ${!p.allow_comments && (!currentUser || !currentUser.is_admin) ? 'disabled' : ''}>发送</button>
                        </div>
                    </div>
                `;
            }
        };
        
        const Interact = {
            async like(id) { await this.do(`${API_BASE}/posts/${id}/like`); Modal.openDetail(id); },
            async bookmark(id) { await this.do(`${API_BASE}/posts/${id}/bookmark`); Modal.openDetail(id); },
            async comment(id) {
                const c = document.getElementById('commentInput').value;
                if(!c) return;
                await fetch(`${API_BASE}/posts/${id}/comments`, {
                    method: 'POST', headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('token')}`},
                    body: JSON.stringify({content: c})
                });
                Modal.openDetail(id);
            },
            async do(url) {
                if(!currentUser) return Modal.open('loginModal');
                await fetch(url, { method: 'POST', headers: {'Authorization': `Bearer ${localStorage.getItem('token')}`} });
            },
            
            async adminDelete(id) {
                if(!confirm('确定要删除这个帖子吗？此操作不可逆！')) return;
                const res = await fetch(`${API_BASE}/posts/${id}`, {
                    method: 'DELETE',
                    headers: {'Authorization': `Bearer ${localStorage.getItem('token')}`}
                });
                if(res.ok) { Toast.success('已删除'); Modal.close('postDetailModal'); Post.load(); }
                else Toast.error('删除失败');
            },
            async adminToggleHide(id) {
                const res = await fetch(`${API_BASE}/posts/${id}/hide`, {
                    method: 'PUT', headers: {'Authorization': `Bearer ${localStorage.getItem('token')}`}
                });
                if(res.ok) { Toast.success('状态已更新'); Modal.openDetail(id); Post.load(); }
            },
            async adminToggleComments(id) {
                const res = await fetch(`${API_BASE}/posts/${id}/comments`, {
                    method: 'PUT', headers: {'Authorization': `Bearer ${localStorage.getItem('token')}`}
                });
                if(res.ok) { Toast.success('状态已更新'); Modal.openDetail(id); }
            }
        };

        const Toast = {
            show(msg, type) {
                const t = document.createElement('div');
                t.className = `toast ${type}`;
                t.textContent = msg;
                document.getElementById('toastContainer').appendChild(t);
                setTimeout(()=>t.remove(), 3000);
            },
            success(m) { this.show(m, 'success'); },
            error(m) { this.show(m, 'error'); },
            info(m) { this.show(m, 'info'); }
        };

        window.addEventListener('load', () => {
            const c = document.getElementById('ghostFireContainer');
            for(let i=0; i<10; i++) {
                const d = document.createElement('div'); d.className='ghost-fire';
                d.style.left=Math.random()*100+'%'; d.style.animationDelay=Math.random()*5+'s';
                c.appendChild(d);
            }
            Auth.init();
            Post.load();
            
            document.getElementById('loginForm').onsubmit = (e) => {
                e.preventDefault();
                Auth.loginWeb2(document.getElementById('loginUsername').value, document.getElementById('loginPassword').value);
            };
            
            // Logout
            document.getElementById('logoutBtn').onclick = () => Auth.logout();
        });
    </script>
</body>
</html>
