<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>诡境 - 创作者工作室</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/web3/1.10.0/web3.min.js" integrity="sha512-+vNl8ghvD2fPZ1XJkZk3/Jj+vbWqT0UeFfH8p1XZq1XqQZq1XqQZq1XqQZq1XqQZq1XqQZq1XqQZq1XqQZq1XqQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        /* ============== 基础重置与变量 ============== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0a0a0f; --bg-secondary: #12121a; --bg-card: #1a1a25; --bg-hover: #222230;
            --text-primary: #e5e5e5; --text-secondary: #8b8b9e; --text-muted: #5a5a6e;
            --accent-purple: #7c3aed; --accent-purple-light: #a78bfa; --accent-purple-dark: #5b21b6;
            --accent-green: #10b981; --accent-red: #ef4444; --accent-orange: #f59e0b; --accent-gold: #ffd700;
            --border-color: #2d2d3d;
            --radius-sm: 6px; --radius-md: 12px; --radius-lg: 16px; --radius-full: 9999px;
            --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; line-height: 1.6;
        }

        /* ============== 滚动条 ============== */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--accent-purple-dark); border-radius: var(--radius-full); }

        /* ============== 鬼火动画 ============== */
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-100vh) scale(1); opacity: 0; }
        }
        .ghost-fire-container { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .ghost-fire {
            position: absolute; width: 4px; height: 4px; background: var(--accent-green); border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-green), 0 0 20px var(--accent-green);
            animation: floatUp linear infinite;
        }

        /* ============== 导航栏 ============== */
        .navbar {
            position: sticky; top: 0; background: rgba(10, 10, 15, 0.95); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color); padding: 0.75rem 1.5rem; z-index: 100;
            display: flex; align-items: center; justify-content: space-between; gap: 1rem;
        }
        .logo { display: flex; align-items: center; gap: 0.5rem; font-size: 1.5rem; font-weight: 700; color: var(--accent-purple); text-decoration: none; }
        
        /* 搜索框 */
        .search-container { flex: 1; max-width: 500px; position: relative; }
        .search-input {
            width: 100%; padding: 0.65rem 1rem 0.65rem 2.8rem; background: var(--bg-secondary);
            border: 1px solid var(--border-color); border-radius: var(--radius-full); color: var(--text-primary);
        }
        .search-icon { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); opacity: 0.6; }

        /* 按钮与菜单 */
        .nav-actions { display: flex; align-items: center; gap: 0.75rem; }
        .btn {
            padding: 0.5rem 1.1rem; border-radius: var(--radius-full); font-size: 0.85rem; font-weight: 500;
            cursor: pointer; transition: all 0.3s; border: none; display: inline-flex; align-items: center; gap: 0.35rem;
            color: white; text-decoration: none;
        }
        .btn-ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border-color); }
        .btn-ghost:hover { border-color: var(--accent-purple); color: var(--text-primary); }
        .btn-primary { background: var(--accent-purple); }
        .btn-primary:hover { background: var(--accent-purple-dark); }
        
        .user-avatar { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--accent-purple); cursor: pointer; }
        
        /* ============== 布局 ============== */
        .main-container {
            max-width: 1200px; margin: 0 auto; padding: 1.5rem; display: grid; grid-template-columns: 200px 1fr; gap: 1.5rem; position: relative; z-index: 2;
        }
        @media (max-width: 900px) { .main-container { grid-template-columns: 1fr; } .sidebar { display: none; } }

        /* 侧边栏 */
        .sidebar-card { background: var(--bg-card); border-radius: var(--radius-md); padding: 1rem; margin-bottom: 1rem; border: 1px solid var(--border-color); }
        .nav-item { padding: 0.7rem; cursor: pointer; color: var(--text-secondary); display: flex; gap: 0.6rem; border-radius: var(--radius-sm); }
        .nav-item:hover, .nav-item.active { background: var(--bg-hover); color: var(--text-primary); }
        .nav-item.active { color: var(--accent-purple-light); }

        /* 瀑布流 */
        .masonry-grid { column-count: 3; column-gap: 1rem; }
        @media (max-width: 1000px) { .masonry-grid { column-count: 2; } }
        @media (max-width: 600px) { .masonry-grid { column-count: 1; } }
        
        .masonry-item { break-inside: avoid; margin-bottom: 1rem; }
        .post-card {
            background: var(--bg-card); border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-color);
            transition: transform 0.3s; cursor: pointer;
        }
        .post-card:hover { transform: translateY(-4px); border-color: var(--accent-purple); }
        .post-image { width: 100%; display: block; }
        .post-content { padding: 1rem; }
        .post-title { font-size: 1rem; font-weight: 600; margin-bottom: 0.5rem; }
        .post-meta { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); margin-top: 0.5rem; }

        /* ============== 模态框 ============== */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85);
            display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(4px);
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--bg-card); border-radius: var(--radius-lg); width: 90%; max-width: 500px;
            max-height: 90vh; overflow-y: auto; border: 1px solid var(--border-color); padding: 1.5rem;
        }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 1rem; align-items: center; }
        .modal-close { background: none; border: none; font-size: 1.5rem; color: var(--text-muted); cursor: pointer; }
        
        .form-group { margin-bottom: 1rem; }
        .form-label { display: block; margin-bottom: 0.4rem; font-size: 0.85rem; color: var(--text-secondary); }
        .form-input {
            width: 100%; padding: 0.75rem; background: var(--bg-secondary); border: 1px solid var(--border-color);
            border-radius: var(--radius-sm); color: var(--text-primary);
        }
        
        /* 详情页样式 */
        .post-detail-modal .modal { max-width: 800px; }
        .post-detail-content { padding: 1rem 0; font-size: 1rem; line-height: 1.8; }
        .post-detail-images img { max-width: 100%; border-radius: var(--radius-md); margin-bottom: 0.5rem; }
        
        /* 评论区 */
        .comments-section { margin-top: 1.5rem; border-top: 1px solid var(--border-color); padding-top: 1rem; }
        .comment-item { margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid var(--bg-secondary); }
        .comment-header { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.3rem; }
        
        /* Toast */
        .toast-container { position: fixed; top: 80px; right: 20px; z-index: 2000; }
        .toast { background: var(--bg-card); border: 1px solid var(--border-color); padding: 0.8rem 1.2rem; border-radius: var(--radius-md); margin-bottom: 0.5rem; color: white; }
        .toast.success { border-color: var(--accent-green); color: var(--accent-green); }
        .toast.error { border-color: var(--accent-red); color: var(--accent-red); }
        
        /* Studio Specific */
        .sidebar-card { background: rgba(26, 26, 37, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: var(--shadow-card); }
        .form-input { background: rgba(18, 18, 26, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); transition: all 0.3s; }
        .form-input:focus { border-color: var(--accent-purple); box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.2); }
        
        .tool-btn {
            background: transparent; border: 1px solid var(--border-color); color: var(--text-secondary);
            padding: 0.4rem 0.8rem; border-radius: var(--radius-sm); cursor: pointer; transition: all 0.2s;
        }
        .tool-btn:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--accent-purple); }
        
        .loading-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(10, 10, 15, 0.9);
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 9999;
        }
        .loading-overlay.active { display: flex; }
        .loading-spinner {
            width: 50px; height: 50px; border: 3px solid rgba(124, 58, 237, 0.3);
            border-radius: 50%; border-top-color: var(--accent-purple);
            animation: spin 1s ease-in-out infinite; margin-bottom: 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="ghost-fire-container" id="ghostFireContainer"></div>
    
    <div class="loading-overlay" id="txLoading">
        <div class="loading-spinner"></div>
        <h3 style="margin-bottom:0.5rem; color:var(--accent-purple-light);">正在上链</h3>
        <p style="color:var(--text-secondary); font-size:0.9rem;">请在钱包中确认交易...</p>
    </div>

    <nav class="navbar">
        <a href="/" class="logo"><span>👻</span> 诡境 (Web3)</a>
        
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" id="searchInput" placeholder="搜索灵异事件..." />
        </div>

        <div class="nav-actions">
            <!-- 创作者入口 -->
            <!-- <button class="btn btn-ghost" ...> -->

            <div id="authButtons">
                <button class="btn btn-primary" onclick="Modal.open('loginModal')">登录 / 注册</button>
            </div>

            <div class="user-menu" id="userMenu" style="display: none; align-items: center; gap: 0.5rem;">
                <span id="userDisplayName" style="font-size: 0.9rem;"></span>
                <img class="user-avatar" id="userAvatarBtn" src="/static/default-avatar.png" />
                <button class="btn btn-ghost" id="logoutBtn" style="padding: 0.3rem 0.6rem; font-size: 0.8rem;">退出</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-container" id="studioView">
        <aside class="sidebar">
            <div class="sidebar-card" style="text-align: center;">
                <div style="width: 80px; height: 80px; background: #333; border-radius: 50%; margin: 0 auto 1rem; display: flex; align-items: center; justify-content: center; font-size: 2rem;">🧙‍♂️</div>
                <h3 id="studioAddrDisplay" style="margin-bottom: 0.5rem;">0x...</h3>
                <div id="studioBadgeDisplay" style="color: var(--accent-gold); font-size: 0.9rem; margin-bottom: 1rem; display: none;">🎖️ 资深探员</div>
                
                <div style="display: grid; grid-template-columns: 1fr; gap: 1rem; margin-top: 1rem;">
                    <div style="background: rgba(255,255,255,0.05); padding: 1rem; border-radius: 8px;">
                        <div style="font-size: 1.5rem; font-weight: bold; color: var(--accent-purple-light);" id="studioPostCount">0</div>
                        <div style="font-size: 0.8rem; color: var(--text-secondary);">已发布</div>
                    </div>
                </div>
            </div>
            
            <div class="sidebar-card">
                <button class="btn btn-ghost" onclick="UI.showFeed()" style="width: 100%;">🔙 返回浏览</button>
            </div>
        </aside>
        
        <main>
            <div class="sidebar-card" style="padding: 2rem;">
                <h2 style="margin-bottom: 1.5rem;">发布新怪谈</h2>
                
                <div class="form-group">
                    <label class="form-label">标题</label>
                    <input type="text" class="form-input" id="studioPostTitle" placeholder="请输入引人入胜的标题...">
                </div>
                
                <div class="form-group">
                    <label class="form-label">正文内容</label>
                    <div class="toolbar">
                        <button class="tool-btn" onclick="Editor.format('bold')"><b>B</b></button>
                        <button class="tool-btn" onclick="Editor.format('italic')"><i>I</i></button>
                        <label class="tool-btn" style="cursor: pointer;">
                            📷 <input type="file" style="display: none;" onchange="Editor.uploadImage(this)">
                        </label>
                    </div>
                    <div id="studioPostContent" class="form-input form-textarea" contenteditable="true" style="overflow-y: auto;"></div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">封面图 (必填)</label>
                    <div style="display:flex; gap:1rem; align-items:flex-start;">
                        <div style="flex:1;">
                            <input type="text" class="form-input" id="studioPostImage" placeholder="输入图片 URL 或点击上传..." oninput="Editor.previewCover(this.value)">
                            <div style="margin-top:0.5rem;">
                                <label class="btn btn-ghost" style="font-size:0.8rem; padding:0.4rem 0.8rem;">
                                    📤 上传图片 <input type="file" style="display:none;" onchange="Editor.uploadCover(this)">
                                </label>
                            </div>
                        </div>
                        <div id="coverPreview" style="width:120px; height:80px; background:var(--bg-secondary); border-radius:8px; border:1px dashed var(--border-color); display:flex; align-items:center; justify-content:center; overflow:hidden;">
                            <span style="font-size:0.8rem; color:var(--text-secondary);">预览</span>
                        </div>
                    </div>
                </div>
                
                <div style="background: rgba(255,255,255,0.05); padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; font-size: 0.9rem; color: var(--text-secondary);">
                    <p>💰 发帖费用: <span style="color: var(--accent-purple-light);">0.001 tBNB</span></p>
                    <p>⛓️ 上链网络: BSC Testnet (97)</p>
                    <p>💾 存储: IPFS 永存 + 数据库映射</p>
                </div>
                
                <button class="btn btn-primary" id="publishBtn" style="width: 100%; padding: 1rem;" onclick="Post.publishFromStudio()">⚡ 支付并发布</button>
            </div>
        </main>
    </div>

    <!-- 登录/注册 模态框 (仅 Web2) -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal">
            <div class="modal-header">
                <h3>🚪 入境方式 (Web2)</h3>
                <button class="modal-close" onclick="Modal.close('loginModal')">&times;</button>
            </div>
            
            <div id="authForms">
                <!-- Login Form -->
                <div id="loginFormContainer">
                    <form id="loginForm">
                        <div class="form-group">
                            <label class="form-label">用户名</label>
                            <input type="text" class="form-input" id="loginUsername" required />
                        </div>
                        <div class="form-group">
                            <label class="form-label">密码</label>
                            <input type="password" class="form-input" id="loginPassword" required />
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%;">登录</button>
                        <div style="text-align: center; margin-top: 1rem; font-size: 0.85rem;">
                            <a href="#" onclick="Auth.toggleForm()" style="color: var(--accent-purple);">没有账号？点击注册</a>
                        </div>
                    </form>
                </div>

                <!-- Register Form -->
                <div id="registerFormContainer" style="display: none;">
                    <div class="form-group">
                        <label class="form-label">用户名</label>
                        <input type="text" class="form-input" id="regUsername" required />
                    </div>
                    <div class="form-group">
                        <label class="form-label">密码</label>
                        <input type="password" class="form-input" id="regPassword" required />
                    </div>
                    <button class="btn btn-primary" style="width: 100%;" onclick="Auth.register()">立即签约</button>
                    <div style="text-align: center; margin-top: 1rem; font-size: 0.85rem;">
                        <a href="#" onclick="Auth.toggleForm()" style="color: var(--text-secondary);">返回登录</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 详情模态框 -->
    <div class="modal-overlay post-detail-modal" id="postDetailModal">
        <div class="modal">
            <div class="modal-header">
                <h3>📖 档案</h3>
                <button class="modal-close" onclick="Modal.close('postDetailModal')">&times;</button>
            </div>
            <div id="postDetailBody"></div>
        </div>
    </div>
    
    <div class="toast-container" id="toastContainer"></div>

    <script>
        const API_BASE = '/api'; // Fixed relative path
        let currentUser = null;

        const Auth = {
            async init() {
                const token = localStorage.getItem('token');
                if (token) await this.fetchMe();
                else {
                    Toast.info('请先登录');
                    Modal.open('loginModal');
                }
                UI.updateAuth();
            },

            async fetchMe() {
                try {
                    const res = await fetch(`${API_BASE}/user/me`, {
                        headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                    });
                    if (res.ok) {
                        currentUser = await res.json();
                        if (currentUser.type !== 'web3') {
                            alert('仅限 Web3 创作者进入');
                            window.location.href = '/';
                            return;
                        }
                        const addr = currentUser.address;
                            document.getElementById('studioAddrDisplay').textContent = addr.substring(0,6) + '...' + addr.substring(38);
                            document.getElementById('studioPostCount').textContent = currentUser.posts_count;
                            if(currentUser.has_nft_badge) document.getElementById('studioBadgeDisplay').style.display = 'block';
                    }
                    else this.logout();
                } catch(e) { console.error(e); }
            },

            toggleForm() {
                const login = document.getElementById('loginFormContainer');
                const reg = document.getElementById('registerFormContainer');
                if (login.style.display === 'none') {
                    login.style.display = 'block'; reg.style.display = 'none';
                } else {
                    login.style.display = 'none'; reg.style.display = 'block';
                }
            },

            async loginWeb2(username, password) {
                const res = await fetch(`${API_BASE}/auth/web2/login`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok) this.success(data);
                else Toast.error(data.error);
            },

            async register() {
                const username = document.getElementById('regUsername').value;
                const password = document.getElementById('regPassword').value;
                const res = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok) this.success(data);
                else Toast.error(data.error);
            },

            success(data) {
                localStorage.setItem('token', data.token);
                currentUser = data.user;
                UI.updateAuth();
                Modal.close('loginModal');
                Toast.success('认证成功');
                // Refresh studio data if needed
                if(currentUser.type === 'web3') {
                    const addr = currentUser.address;
                    document.getElementById('studioAddrDisplay').textContent = addr.substring(0,6) + '...' + addr.substring(38);
                    document.getElementById('studioPostCount').textContent = currentUser.posts_count;
                    if(currentUser.has_nft_badge) document.getElementById('studioBadgeDisplay').style.display = 'block';
                }
            },

            logout() {
                localStorage.removeItem('token');
                currentUser = null;
                UI.updateAuth();
                Toast.info('已退出');
            }
        };

        const Editor = {
            format(cmd) { document.execCommand(cmd, false, null); },
            async uploadImage(input) {
                const file = input.files[0];
                if (!file) return;
                
                const formData = new FormData();
                formData.append('file', file);
                
                // Show loading state
                const btn = input.parentElement;
                const originalText = btn.innerHTML;
                btn.innerHTML = '📷 ...';
                
                try {
                    const res = await fetch(`${API_BASE}/upload`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` },
                        body: formData
                    });
                    const data = await res.json();
                    
                    if (data.url) {
                        this.format('insertImage', data.url);
                        // Fix: insertImage doesn't take URL in some browsers, use manual insertion
                        document.execCommand('insertImage', false, data.url);
                    } else {
                        Toast.error(data.error || '上传失败');
                    }
                } catch(e) {
                    console.error(e);
                    Toast.error('上传出错');
                } finally {
                    btn.innerHTML = originalText;
                }
            },
            async uploadCover(input) {
                const file = input.files[0];
                if (!file) return;
                
                const formData = new FormData();
                formData.append('file', file);
                
                // Show loading
                const btn = input.parentElement;
                const originalText = btn.innerHTML;
                btn.innerHTML = '上传中...';
                
                try {
                    const res = await fetch(`${API_BASE}/upload`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` },
                        body: formData
                    });
                    const data = await res.json();
                    
                    if (data.url) {
                        document.getElementById('studioPostImage').value = data.url;
                        this.previewCover(data.url);
                    } else {
                        Toast.error(data.error || '上传失败');
                    }
                } catch(e) {
                    console.error(e);
                    Toast.error('上传出错');
                } finally {
                    btn.innerHTML = originalText;
                }
            },
            previewCover(url) {
                const p = document.getElementById('coverPreview');
                if(url) {
                    p.innerHTML = `<img src="${url}" style="width:100%; height:100%; object-fit:cover;">`;
                    p.style.border = '1px solid var(--accent-purple)';
                } else {
                    p.innerHTML = '<span style="font-size:0.8rem; color:var(--text-secondary);">预览</span>';
                    p.style.border = '1px dashed var(--border-color)';
                }
            }
        };

        const Post = {
            async load(params={}) {
                const q = new URLSearchParams(params).toString();
                const headers = {};
                const token = localStorage.getItem('token');
                if (token) headers['Authorization'] = `Bearer ${token}`;

                const res = await fetch(`${API_BASE}/posts?${q}`, { headers });
                const data = await res.json();
                UI.renderPosts(data.posts);
            },
            
            async publishFromStudio() {
                const btn = document.getElementById('publishBtn');
                if (btn.disabled) return;
                
                if (!web3) web3 = new Web3(window.ethereum);
                const title = document.getElementById('studioPostTitle').value;
                const content = document.getElementById('studioPostContent').innerHTML;
                const coverImage = document.getElementById('studioPostImage').value;
                
                if(!title || !content) return Toast.error('标题和内容不能为空');
                if(!coverImage) return Toast.error('请上传封面图');

                try {
                    // Lock UI
                    btn.disabled = true;
                    btn.textContent = '准备中...';
                    
                    // Check Chain
                    const cRes = await fetch(`${API_BASE}/config/fees`);
                    const config = await cRes.json();
                    
                    const chainId = await web3.eth.getChainId();
                    if (Number(chainId) !== Number(config.chain_id)) {
                        try {
                            await ethereum.request({
                                method: 'wallet_switchEthereumChain',
                                params: [{ chainId: web3.utils.toHex(config.chain_id) }],
                            });
                        } catch (switchError) {
                            btn.disabled = false; btn.textContent = '⚡ 支付并发布';
                            return Toast.error(`请切换到 BSC Testnet (Chain ID: ${config.chain_id})`);
                        }
                    }

                    // Pay Gas
                    document.getElementById('txLoading').classList.add('active');
                    
                    const txHash = await ethereum.request({
                        method: 'eth_sendTransaction',
                        params: [{
                            to: config.receive_address,
                            from: currentUser.address,
                            value: web3.utils.toHex(config.fee),
                            chainId: config.chain_id
                        }]
                    });
                    
                    // Save
                    const res = await fetch(`${API_BASE}/posts`, {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        },
                        body: JSON.stringify({
                            title, content, tx_hash: txHash,
                            cover_image: coverImage,
                            images: []
                        })
                    });
                    
                    document.getElementById('txLoading').classList.remove('active');
                    
                    if (res.ok) {
                        Toast.success('发布成功');
                        document.getElementById('studioPostTitle').value = '';
                        document.getElementById('studioPostContent').innerHTML = '';
                        Auth.fetchMe(); 
                    } else Toast.error((await res.json()).error);
                } catch(e) { 
                    document.getElementById('txLoading').classList.remove('active');
                    Toast.error('发布失败: ' + e.message); 
                } finally {
                    btn.disabled = false;
                    btn.textContent = '⚡ 支付并发布';
                }
            },

            async repost(id) {
                if (!currentUser) return Modal.open('loginModal');
                const content = prompt("转发附言:");
                if (content === null) return;

                const res = await fetch(`${API_BASE}/posts/${id}/repost`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify({ content })
                });
                if(res.ok) { Toast.success('转发成功'); this.load(); }
                else Toast.error((await res.json()).error);
            }
        };

        const UI = {
            updateAuth() {
                const authBtns = document.getElementById('authButtons');
                const userMenu = document.getElementById('userMenu');
                
                if (currentUser) {
                    authBtns.style.display = 'none';
                    userMenu.style.display = 'flex';
                    let displayName = currentUser.nickname;
                    if (currentUser.type === 'web3' && currentUser.address) {
                        displayName = currentUser.address.substring(0, 6) + '...' + currentUser.address.substring(38);
                    }
                    document.getElementById('userDisplayName').textContent = displayName + (currentUser.has_nft_badge ? ' 🎖️' : '');
                    if(currentUser.avatar) document.getElementById('userAvatarBtn').src = currentUser.avatar;
                } else {
                    authBtns.style.display = 'flex';
                    userMenu.style.display = 'none';
                }
            },

            renderPosts(posts) {
                const grid = document.getElementById('postGrid');
                grid.innerHTML = posts.map(p => {
                    const img = p.images && p.images.length ? `<img src="${p.images[0]}" class="post-image">` : '';
                    let content = p.content;
                    if (p.original_post_id && p.original_post) {
                     const original = p.original_post;
                     content = `<div style="font-size:0.8rem; color:var(--text-secondary); margin-bottom:0.5rem;">🔄 转发了 <b>${original.author.nickname}</b></div>` +
                               `<div style="padding:0.5rem; background:var(--bg-secondary); border-radius:4px; margin-bottom:0.5rem;">` + 
                               `<div style="font-weight:600;">${original.title}</div>` +
                               `</div>` + 
                               (p.repost_comment || '');
                }
                    return `
                    <div class="masonry-item">
                        <div class="post-card" onclick="Modal.openDetail(${p.id})">
                            ${img}
                            <div class="post-content">
                                <div class="post-title">${p.title}</div>
                                <div class="post-meta">
                                    <span>${p.author.nickname}</span>
                                    <span>💬 ${p.comments_count}</span>
                                </div>
                            </div>
                        </div>
                    </div>`;
                }).join('');
                document.getElementById('loadingArea').style.display = 'none';
            }
        };

        const Modal = {
            open(id) { document.getElementById(id).classList.add('active'); },
            close(id) { document.getElementById(id).classList.remove('active'); },
            
            async openDetail(id) {
                this.open('postDetailModal');
                const body = document.getElementById('postDetailBody');
                body.innerHTML = '加载中...';
                
                const res = await fetch(`${API_BASE}/posts/${id}`);
                const p = await res.json();
                
                let contentHtml = p.content;
                let repostHtml = '';
                if (p.original_post_id && p.original_post) {
                    contentHtml = p.repost_comment || '';
                    repostHtml = `
                        <div style="margin:1rem 0; padding:1rem; border:1px solid var(--border-color); border-radius:8px; background:var(--bg-secondary);">
                            <div style="font-weight:600; margin-bottom:0.5rem;">${p.original_post.title}</div>
                            <div style="font-size:0.9rem; color:var(--text-secondary);">${p.original_post.content}</div>
                        </div>
                    `;
                }

                const commentsHtml = p.comments.map(c => `
                    <div class="comment-item">
                        <div class="comment-header"><span>${c.author.nickname}</span><span>${new Date(c.created_at).toLocaleDateString()}</span></div>
                        <div>${c.content}</div>
                    </div>
                `).join('');

                body.innerHTML = `
                    <h2 style="margin-bottom:0.5rem;">${p.title}</h2>
                    <div style="font-size:0.85rem; color:var(--text-muted); margin-bottom:1rem;">
                        发布者: ${p.author.nickname} | 浏览: ${p.view_count}
                    </div>
                    <div class="post-detail-content">
                        ${contentHtml}
                        ${repostHtml}
                    </div>
                    
                    <div style="font-size:0.8rem; color:var(--text-secondary); margin-top:1rem;">
                        ⛓ TX: <a href="https://testnet.bscscan.com/tx/${p.tx_hash}" target="_blank" style="color:var(--accent-purple);">${p.tx_hash ? p.tx_hash.substring(0,10)+'...'+p.tx_hash.substring(56) : 'N/A'}</a>
                        ${p.ipfs_cid ? `<span style="margin-left:10px;">💾 IPFS: <a href="https://ipfs.io/ipfs/${p.ipfs_cid}" target="_blank" style="color:var(--accent-green);">永存档案</a></span>` : ''}
                    </div>
                    
                    <div style="display:flex; gap:1rem; margin:1rem 0; border-top:1px solid var(--border-color); padding-top:1rem;">
                        <button class="btn btn-ghost" onclick="Interact.like(${p.id})">😰 恐惧 (${p.likes_count})</button>
                        <button class="btn btn-ghost" onclick="Interact.bookmark(${p.id})">⭐ 收藏 (${p.is_bookmarked ? '已收' : ''})</button>
                        <button class="btn btn-ghost" onclick="Post.repost(${p.id})">🔄 转发</button>
                    </div>

                    <div class="comments-section">
                        <h4>评论</h4>
                        <div style="margin-bottom:1rem;">${commentsHtml}</div>
                        <div style="display:flex; gap:0.5rem;">
                            <input type="text" id="commentInput" class="form-input" placeholder="发表评论...">
                            <button class="btn btn-primary" onclick="Interact.comment(${p.id})">发送</button>
                        </div>
                    </div>
                `;
            }
        };
        
        const Interact = {
            async like(id) { await this.do(`${API_BASE}/posts/${id}/like`); Modal.openDetail(id); },
            async bookmark(id) { await this.do(`${API_BASE}/posts/${id}/bookmark`); Modal.openDetail(id); },
            async comment(id) {
                const c = document.getElementById('commentInput').value;
                if(!c) return;
                await fetch(`${API_BASE}/posts/${id}/comments`, {
                    method: 'POST', headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('token')}`},
                    body: JSON.stringify({content: c})
                });
                Modal.openDetail(id);
            },
            async do(url) {
                if(!currentUser) return Modal.open('loginModal');
                await fetch(url, { method: 'POST', headers: {'Authorization': `Bearer ${localStorage.getItem('token')}`} });
            }
        };

        const Toast = {
            show(msg, type) {
                const t = document.createElement('div');
                t.className = `toast ${type}`;
                t.textContent = msg;
                document.getElementById('toastContainer').appendChild(t);
                setTimeout(()=>t.remove(), 3000);
            },
            success(m) { this.show(m, 'success'); },
            error(m) { this.show(m, 'error'); },
            info(m) { this.show(m, 'info'); }
        };

        window.addEventListener('load', () => {
            const c = document.getElementById('ghostFireContainer');
            for(let i=0; i<10; i++) {
                const d = document.createElement('div'); d.className='ghost-fire';
                d.style.left=Math.random()*100+'%'; d.style.animationDelay=Math.random()*5+'s';
                c.appendChild(d);
            }
            Auth.init();
            Post.load();
            
            document.getElementById('loginForm').onsubmit = (e) => {
                e.preventDefault();
                Auth.loginWeb2(document.getElementById('loginUsername').value, document.getElementById('loginPassword').value);
            };
            
            // Logout
            const logoutBtn = document.getElementById('logoutBtn');
            if(logoutBtn) logoutBtn.onclick = () => Auth.logout();
        });
    </script>
</body>
</html>
