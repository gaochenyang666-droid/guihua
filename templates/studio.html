<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#7c3aed">
    <title>诡话 - 创作者工作室</title>
    <!-- Favicon 统一使用 logo.svg，适配桌面与移动端 -->
    <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
    <link rel="shortcut icon" href="/static/logo.svg">
    <link rel="apple-touch-icon" href="/static/logo.svg">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="stylesheet" href="/static/style.css?v={{ asset_version }}">
    <link href="/static/vendor/quill.snow.css" rel="stylesheet">
    <style>
        /* 发布页深色主题：正文、标题、表单、步骤条统一为浅色可辨 */
        .studio-container,
        .studio-container .form-label,
        .studio-container .form-input,
        .studio-container h2,
        .studio-container .step-item { color: var(--text-primary); }
        .studio-container .form-label { color: var(--text-secondary); }
        .studio-container .step-item { color: var(--text-secondary); }
        .studio-container .step-item.active { color: #fff; }
        .studio-container .step-item div { color: inherit; }
        .studio-container h2 { color: var(--text-primary); font-weight: 600; }

        /* Quill 编辑器：深色背景 + 浅色正文与占位符，覆盖 snow 默认黑字 */
        #quillEditorWrap .ql-editor {
            background: rgba(0,0,0,0.35);
            color: var(--text-primary);
            min-height: 200px;
        }
        #quillEditorWrap .ql-editor.ql-blank::before { color: var(--text-muted); }
        #quillEditorWrap .ql-editor p,
        #quillEditorWrap .ql-editor span,
        #quillEditorWrap .ql-editor strong,
        #quillEditorWrap .ql-editor b,
        #quillEditorWrap .ql-editor u,
        #quillEditorWrap .ql-editor i,
        #quillEditorWrap .ql-editor a { color: inherit; }
        #quillEditorWrap .ql-editor img {
            display: inline-block;
            vertical-align: middle;
            max-width: min(100%, 420px);
            height: auto;
            margin: 0.15rem 0.45rem 0.35rem 0;
            border-radius: 8px;
        }
        #quillEditorWrap .ql-toolbar {
            background: rgba(0,0,0,0.35);
            border-color: var(--border-color);
        }
        #quillEditorWrap .ql-toolbar .ql-stroke { stroke: rgba(255,255,255,0.4); }
        #quillEditorWrap .ql-toolbar .ql-fill { fill: rgba(255,255,255,0.6); }
        #quillEditorWrap .ql-toolbar .ql-picker,
        #quillEditorWrap .ql-toolbar .ql-picker-label { color: var(--text-secondary); }
        #quillEditorWrap .ql-toolbar button:hover .ql-stroke { stroke: var(--accent-purple-light); }
        #quillEditorWrap .ql-toolbar button:hover .ql-fill { fill: var(--accent-purple-light); }
        #quillEditorWrap .ql-toolbar .ql-picker-options { background: var(--bg-secondary); color: var(--text-primary); border-color: var(--border-color); }
    </style>
    <script src="/static/common.js?v={{ asset_version }}"></script>
    <script src="/static/toast.js?v={{ asset_version }}"></script>
    <script src="/static/vendor/web3.min.js"></script>
    <script src="/static/vendor/quill.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="ghost-fire-container" id="ghostFireContainer"></div>
    {% include 'partials/studio_payment_drawer.html' %}

    <nav class="navbar glass">
        {% with subtitle='Web3' %}
        {% include 'partials/navbar_brand.html' %}
        {% endwith %}
        {% include 'partials/studio_user_menu.html' %}
    </nav>

    {% include 'partials/studio_main_shell.html' %}
    {% include 'partials/studio_login_modal.html' %}
    
    <div class="toast-container" id="toastContainer"></div>

    <script src="/static/studio.js?v={{ asset_version }}"></script>
</body>
</html>
