name: release-suite-remote

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to verify (e.g. https://guihua.fun)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-suite-remote-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile sanity check
        run: |
          python3 -m py_compile app.py routes/*.py services/*.py utils/*.py scripts/*.py

      - name: Preflight inputs and secrets
        env:
          GUIHUA_ADMIN_TOKEN: ${{ secrets.GUIHUA_ADMIN_TOKEN }}
          GUIHUA_ADMIN_USERNAME: ${{ secrets.GUIHUA_ADMIN_USERNAME }}
          GUIHUA_ADMIN_PASSWORD: ${{ secrets.GUIHUA_ADMIN_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          BASE_URL_RAW: ${{ inputs.base_url || secrets.GUIHUA_BASE_URL }}
          DEFAULT_BASE_URL: https://guihua.fun
        run: |
          set -euo pipefail
          BASE_URL="$(printf '%s' "${BASE_URL_RAW:-}" | tr -d '\r' | head -n 1 | xargs)"
          if [ -z "${BASE_URL:-}" ]; then
            BASE_URL="${DEFAULT_BASE_URL}"
          fi
          if ! printf '%s' "${BASE_URL}" | grep -Eq '^https?://'; then
            echo "Invalid BASE_URL detected from workflow input or GUIHUA_BASE_URL secret; falling back to ${DEFAULT_BASE_URL}." >&2
            BASE_URL="${DEFAULT_BASE_URL}"
          fi
          if [ -z "${GUIHUA_ADMIN_TOKEN:-}" ] && { [ -z "${GUIHUA_ADMIN_USERNAME:-}" ] || [ -z "${GUIHUA_ADMIN_PASSWORD:-}" ]; }; then
            echo "Admin auth is required. Set GUIHUA_ADMIN_TOKEN or both GUIHUA_ADMIN_USERNAME and GUIHUA_ADMIN_PASSWORD." >&2
            exit 1
          fi
          echo "base_url=${BASE_URL}"
          if [ -n "${GUIHUA_ADMIN_TOKEN:-}" ]; then
            echo "auth_mode=admin_token"
          else
            echo "auth_mode=admin_username_password"
          fi
          if [ -n "${SECRET_KEY:-}" ]; then
            echo "secret_key=present"
          else
            echo "secret_key=missing_using_script_fallback"
          fi
          {
            echo "## Release Suite Preflight"
            echo ""
            echo "- sha: \`${GITHUB_SHA}\`"
            echo "- base_url: \`${BASE_URL}\`"
            if [ -n "${GUIHUA_ADMIN_TOKEN:-}" ]; then
              echo "- admin auth: token"
            else
              echo "- admin auth: username/password"
            fi
            if [ -n "${SECRET_KEY:-}" ]; then
              echo "- secret_key: repository secret present"
            else
              echo "- secret_key: missing (wallet script fallback will be used)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run remote release suite
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          GUIHUA_SKIP_SSL_VERIFY: ${{ secrets.GUIHUA_SKIP_SSL_VERIFY }}
          GUIHUA_ADMIN_TOKEN: ${{ secrets.GUIHUA_ADMIN_TOKEN }}
          GUIHUA_USER_TOKEN: ${{ secrets.GUIHUA_USER_TOKEN }}
          GUIHUA_ADMIN_USERNAME: ${{ secrets.GUIHUA_ADMIN_USERNAME }}
          GUIHUA_ADMIN_PASSWORD: ${{ secrets.GUIHUA_ADMIN_PASSWORD }}
          GUIHUA_USER_USERNAME: ${{ secrets.GUIHUA_USER_USERNAME }}
          GUIHUA_USER_PASSWORD: ${{ secrets.GUIHUA_USER_PASSWORD }}
          BASE_URL_RAW: ${{ inputs.base_url || secrets.GUIHUA_BASE_URL }}
          DEFAULT_BASE_URL: https://guihua.fun
        run: |
          set -euo pipefail
          BASE_URL="$(printf '%s' "${BASE_URL_RAW:-}" | tr -d '\r' | head -n 1 | xargs)"
          if [ -z "${BASE_URL:-}" ]; then
            BASE_URL="${DEFAULT_BASE_URL}"
          fi
          if ! printf '%s' "${BASE_URL}" | grep -Eq '^https?://'; then
            echo "Invalid BASE_URL detected from workflow input or GUIHUA_BASE_URL secret; falling back to ${DEFAULT_BASE_URL}." >&2
            BASE_URL="${DEFAULT_BASE_URL}"
          fi
          set +e
          python3 scripts/check_release_suite.py "${BASE_URL}" > release-suite.out.txt 2> release-suite.err.txt
          rc=$?
          set -e
          cat release-suite.out.txt
          if [ -s release-suite.err.txt ]; then
            echo "---- stderr ----" >&2
            cat release-suite.err.txt >&2
          fi
          python3 - <<'PY'
          import pathlib
          out = pathlib.Path('release-suite.out.txt').read_text(errors='ignore')
          err = pathlib.Path('release-suite.err.txt').read_text(errors='ignore')
          summary_lines = [
              "## Release Suite Result",
              "",
          ]
          if 'release_suite_ok=1' in out:
              summary_lines.append("- status: success")
          else:
              summary_lines.append("- status: failed")
          if 'release_suite_summary=' in out:
              for line in out.splitlines():
                  if line.startswith('release_suite_summary=') or line.startswith('release_suite_ok='):
                      summary_lines.append(f"- {line}")
          if err.strip():
              summary_lines.extend(["", "### stderr tail", "", "```text", *err.splitlines()[-20:], "```"])
          pathlib.Path('.release_suite_summary.md').write_text("\n".join(summary_lines) + "\n", encoding='utf-8')
          PY
          cat .release_suite_summary.md >> "$GITHUB_STEP_SUMMARY"
          if [ $rc -ne 0 ]; then
            echo "release suite exited with code $rc" >&2
          fi
          python3 -c "import sys, pathlib; out=pathlib.Path('release-suite.out.txt').read_text(errors='ignore'); sys.exit(0 if 'release_suite_ok=1' in out else 1)"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-suite-logs
          path: |
            release-suite.out.txt
            release-suite.err.txt
            .release_suite_summary.md
